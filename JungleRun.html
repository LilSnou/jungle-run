/* ==== js/core/Config.js ==== */
/**
 * Jungle Run — глобальная конфигурация.
 * Логическое разрешение канваса: 320x180 (16:9, «восьмибитный» масштаб).
 */
const CONFIG = {
  WIDTH: 320,
  HEIGHT: 180,
  GROUND_Y: 150,          // уровень земли (верх травы)
  SCALE: 2,               // множитель пикселя спрайта (18px герой -> 36px на экране)

  GRAVITY: 1700,          // px/с^2
  JUMP_VELOCITY: -390,    // скорость прыжка (высота ~45px)
  DOUBLE_JUMP_FACTOR: 0.9,
  STOMP_BOUNCE: -300,

  RUN_START: 118,         // начальная скорость, px/с
  RUN_MAX: 232,           // максимальная скорость
  RUN_EASE: 1.7,          // степень разгона к концу локации
  KNOCKBACK_TIME: 0.55,   // замедление после урона

  COYOTE_TIME: 0.09,      // «кайот-тайм» для прыжка с края
  JUMP_BUFFER: 0.10,      // буфер нажатия перед приземлением

  START_LIVES: 3,
  INVULN_TIME: 2.0,       // неуязвимость после урона (как в Godot)

  TRANSITION_EVERY: 550,  // метров до смены локации
  IDOL_SCORE: 50,
  STOMP_SCORE: 100,

  GRAVITY_SCALE: 1.0,
};

/** Ограничение значения диапазоном. */
function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }

/** Пересечение прямоугольников (AABB). */
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/** Детерминированный ГПСЧ (mulberry32) — для повторяемых «случайных» фонов. */
function makeRandom(seed) {
  let s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  <script>
/* ==== js/core/EventBus.js ==== */
/**
 * EventBus — паттерн «Наблюдатель» (Observer).
 * Все части игры общаются через события, не зная друг о друге напрямую:
 * игрок не знает про HUD; HUD подписывается на событие 'score:changed'.
 *
 * Инкапсуляция: слушатели скрыты за приватным полем.
 */
class EventBus {
  #listeners = new Map();

  /** Подписка на событие. */
  on(type, fn) {
    if (!this.#listeners.has(type)) this.#listeners.set(type, []);
    this.#listeners.get(type).push(fn);
    return this;
  }

  /** Отписка. */
  off(type, fn) {
    const list = this.#listeners.get(type);
    if (list) {
      const i = list.indexOf(fn);
      if (i >= 0) list.splice(i, 1);
    }
    return this;
  }

  /** Рассылка события всем подписчикам. */
  emit(type, payload) {
    const list = this.#listeners.get(type);
    if (list) for (const fn of list.slice()) fn(payload);
  }

  /** Полная очистка (при рестарте). */
  clear() { this.#listeners.clear(); }
}

/** Глобальная шина событий игры. */
const events = new EventBus();

  <script>
/* ==== js/core/AudioManager.js ==== */
/**
 * AudioManager — паттерн «Одиночка» (Singleton).
 *
 * Вся музыка и звуки синтезируются «на лету» через Web Audio API
 * (без единого аудиофайла) в стиле чиптюнов 8-битных консолей:
 *   - квадратная волна  → мелодия и бас (NES-подобный «пульс»)
 *   - шумовой канал     → ударные
 *
 * Инкапсуляция: AudioContext, громкость и планировщик нот скрыты
 * за приватными полями; наружу — только play()/musicOn()/unlock().
 */
class AudioManager {
  static #instance = null;

  /** @returns {AudioManager} единственный экземпляр. */
  static get instance() {
    if (!AudioManager.#instance) AudioManager.#instance = new AudioManager();
    return AudioManager.#instance;
  }

  #ctx = null;
  #master = null;
  #musicGain = null;
  #sfxGain = null;
  #noiseBuffer = null;
  #timer = null;
  #step = 0;
  #nextTime = 0;
  #song = null;
  #muted = false;

  constructor() {
    if (AudioManager.#instance) throw new Error('AudioManager — одиночка, используйте AudioManager.instance');
  }

  /** Разблокировка аудио (нужен жест пользователя). */
  unlock() {
    if (this.#ctx) { if (this.#ctx.state === 'suspended') this.#ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.#ctx = new AC();
    this.#master = this.#ctx.createGain();
    this.#master.gain.value = this.#muted ? 0 : 0.9;
    this.#master.connect(this.#ctx.destination);

    this.#musicGain = this.#ctx.createGain();
    this.#musicGain.gain.value = 0.42;
    this.#musicGain.connect(this.#master);

    this.#sfxGain = this.#ctx.createGain();
    this.#sfxGain.gain.value = 0.75;
    this.#sfxGain.connect(this.#master);

    // если трек уже выбран — запускаем секвенсор
    if (this.#song && !this.#timer) {
      this.#nextTime = this.#ctx.currentTime + 0.06;
      this.#timer = setInterval(() => this.#schedule(), 25);
    }

    // Буфер белого шума для ударных и «скольжения».
    const len = this.#ctx.sampleRate * 0.4;
    this.#noiseBuffer = this.#ctx.createBuffer(1, len, this.#ctx.sampleRate);
    const data = this.#noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }

  get muted() { return this.#muted; }

  /** Переключение звука (клавиша M / кнопка динамика). */
  toggleMute() {
    this.#muted = !this.#muted;
    if (this.#master) this.#master.gain.value = this.#muted ? 0 : 0.9;
    return this.#muted;
  }

  /** Частота ноты вида «C4», «F#3»; null/пусто — пауза. */
  static #freq(note) {
    if (!note || note === '.') return 0;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(note);
    if (!m) return 0;
    const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
    const acc = m[2] === '#' ? 1 : (m[2] === 'b' ? -1 : 0);
    const midi = base + acc + (parseInt(m[3], 10) + 1) * 12;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  /** Осциллятор + огибающая. */
  #tone({ type = 'square', freq = 440, when = 0, dur = 0.1, vol = 0.5, glideTo = 0, dest = null }) {
    if (!this.#ctx) return;
    const t = this.#ctx.currentTime + when;
    const osc = this.#ctx.createOscillator();
    const g = this.#ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, glideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(dest || this.#sfxGain);
    osc.start(t); osc.stop(t + dur + 0.02);
  }

  /** Шумовой всплеск (ударные, «скольжение», взрывы). */
  #noise({ when = 0, dur = 0.1, vol = 0.4, from = 8000, to = 600 }) {
    if (!this.#ctx || !this.#noiseBuffer) return;
    const t = this.#ctx.currentTime + when;
    const src = this.#ctx.createBufferSource();
    src.buffer = this.#noiseBuffer;
    const filt = this.#ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(from, t);
    filt.frequency.exponentialRampToValueAtTime(Math.max(60, to), t + dur);
    filt.Q.value = 1.2;
    const g = this.#ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(this.#sfxGain);
    src.start(t); src.stop(t + dur + 0.02);
  }

  /** Воспроизведение эффекта по имени. */
  play(name) {
    if (!this.#ctx || this.#muted) return;
    switch (name) {
      case 'jump':
        this.#tone({ freq: 300, glideTo: 640, dur: 0.13, vol: 0.35 });
        break;
      case 'doubleJump':
        this.#tone({ freq: 480, glideTo: 980, dur: 0.12, vol: 0.3 });
        this.#tone({ type: 'triangle', freq: 960, when: 0.02, dur: 0.08, vol: 0.2 });
        break;
      case 'slide':
        this.#noise({ dur: 0.22, vol: 0.35, from: 5200, to: 700 });
        break;
      case 'coin':
        this.#tone({ freq: AudioManager.#freq('B5'), dur: 0.06, vol: 0.32 });
        this.#tone({ freq: AudioManager.#freq('E6'), when: 0.06, dur: 0.18, vol: 0.32 });
        break;
      case 'stomp':
        this.#tone({ freq: 340, glideTo: 90, dur: 0.14, vol: 0.4 });
        this.#noise({ dur: 0.1, vol: 0.3, from: 2500, to: 300 });
        break;
      case 'hurt':
        this.#tone({ type: 'sawtooth', freq: 420, glideTo: 70, dur: 0.28, vol: 0.4 });
        this.#noise({ dur: 0.2, vol: 0.3, from: 3000, to: 250 });
        break;
      case 'fall':
        this.#tone({ type: 'sawtooth', freq: 500, glideTo: 50, dur: 0.5, vol: 0.4 });
        break;
      case 'heart':
        this.#tone({ type: 'triangle', freq: AudioManager.#freq('C5'), dur: 0.07, vol: 0.4 });
        this.#tone({ type: 'triangle', freq: AudioManager.#freq('E5'), when: 0.07, dur: 0.07, vol: 0.4 });
        break;
      case 'gameOver': {
        const seq = ['G3', 'E3', 'C3', 'G2'];
        seq.forEach((n, i) => this.#tone({
          type: 'triangle', freq: AudioManager.#freq(n), when: i * 0.16, dur: 0.22, vol: 0.45,
        }));
        break;
      }
      case 'start':
        ['C4', 'E4', 'G4', 'C5'].forEach((n, i) => this.#tone({
          freq: AudioManager.#freq(n), when: i * 0.08, dur: 0.1, vol: 0.35,
        }));
        break;
      case 'biome':
        ['E4', 'G4', 'B4', 'E5'].forEach((n, i) => this.#tone({
          type: 'triangle', freq: AudioManager.#freq(n), when: i * 0.09, dur: 0.14, vol: 0.4,
        }));
        break;
      case 'click':
        this.#tone({ freq: 720, glideTo: 520, dur: 0.07, vol: 0.25 });
        break;
      case 'victory': {
        // фанфара: восходящее арpeggio и длинная финальная нота
        const seq = [
          ['C4', 0, 0.12], ['E4', 0.12, 0.12], ['G4', 0.24, 0.12], ['C5', 0.36, 0.3],
          ['G4', 0.66, 0.1], ['C5', 0.76, 0.6],
        ];
        for (const [n, when, dur] of seq) {
          this.#tone({ freq: AudioManager.#freq(n), when, dur, vol: 0.4 });
          this.#tone({ type: 'triangle', freq: AudioManager.#freq(n) / 2, when, dur, vol: 0.28 });
        }
        break;
      }
    }
  }

  // ------------------------------------------------------------------
  // Музыка: маленький степ-секвенсор (2 канала + ударные).
  // ------------------------------------------------------------------

  /**
   * Смена биома меняет «саундтрек»: свой темп и паттерны для
   * джунглей, деревни и храма.
   */
  playSong(name) {
    if (this.#song && this.#song.name === name) return;
    this.#song = AudioTracks[name] || null;
    this.#step = 0;
    if (this.#song && this.#ctx && !this.#timer) {
      this.#nextTime = this.#ctx.currentTime + 0.06;
      this.#timer = setInterval(() => this.#schedule(), 25);
    }
    if (!this.#song) { clearInterval(this.#timer); this.#timer = null; }
  }

  /** Полная остановка музыки (экран победы). */
  stopSong() {
    this.#song = null;
    clearInterval(this.#timer);
    this.#timer = null;
  }

  #schedule() {
    if (!this.#ctx || !this.#song || this.#muted) return;
    const stepDur = 60 / this.#song.bpm / 4; // 16-е ноты
    while (this.#nextTime < this.#ctx.currentTime + 0.14) {
      const i = this.#step % this.#song.bass.length;
      const lead = this.#song.lead[i];
      const bass = this.#song.bass[i];
      const drum = this.#song.drums[i];
      const arp = this.#song.arp ? this.#song.arp[i] : null;
      const when = this.#nextTime - this.#ctx.currentTime;

      if (bass && bass !== '.') {
        this.#tone({ type: 'triangle', freq: AudioManager.#freq(bass), when, dur: stepDur * 1.8, vol: 0.5, dest: this.#musicGain });
      }
      if (lead && lead !== '.') {
        this.#tone({ type: 'square', freq: AudioManager.#freq(lead), when, dur: stepDur * 0.9, vol: 0.16, dest: this.#musicGain });
      }
      if (arp && arp !== '.') {
        this.#tone({ type: 'square', freq: AudioManager.#freq(arp), when, dur: stepDur * 0.7, vol: 0.07, dest: this.#musicGain });
      }
      if (drum === 'k') this.#noise({ when, dur: 0.09, vol: 0.35, from: 400, to: 80 });
      if (drum === 'h') this.#noise({ when, dur: 0.03, vol: 0.12, from: 9000, to: 6000 });
      if (drum === 's') this.#noise({ when, dur: 0.14, vol: 0.25, from: 4000, to: 900 });
      if (drum === 't') this.#noise({ when, dur: 0.11, vol: 0.3, from: 900, to: 150 }); // «том» для деревни

      this.#nextTime += stepDur;
      this.#step++;
    }
  }
}

/**
 * Музыкальные треки биомов (16-шаговые петли, NES-стиль).
 * У каждой локации — свой темп, тональность и ритм:
 *   jungle  — 132 BPM, C-минор, «мчащийся» рифф;
 *   village — 112 BPM, F-мажор, племенные том-барабаны;
 *   temple  — 150 BPM, D-минор, тревожный арпеджио-канал (arp).
 * '.', — пауза. k — бочка, s — малый барабан, h — хэт, t — том.

const AudioTracks = {

    bass:  ['C2', 'C2', '.', 'C2', 'Eb2', '.', 'C2', '.',
            'Bb1', 'Bb1', '.', 'Bb1', 'G2', '.', 'Ab2', '.'],

    arp:   ['.', '.', '.', 'F4', '.', '.', '.', 'A4',

    lead:  ['D5', '.', 'C5', '.', 'A4', '.', 'B4', '.',

  <script>
/* ==== js/core/Input.js ==== */
/**
 * Input — единый ввод (клавиатура + тач).
 *
 * Скруглённый интерфейс для остальной игры: остальной код не знает
 * ничего про клавиши или координаты касаний — только игровые действия
 * «jump», «slide», «pause» и их состояние в текущем кадре.
 *
 * Паттерн: «Быстрое решение» (Facade) поверх устройств ввода.
 */
class Input {
  #held = { jump: false, slide: false, pause: false };
  #pressed = new Set();
  #released = new Set();
  #pointers = new Map();      // pointerId -> действие (мультитач)
  #firstInteraction = false;

  constructor() {
    window.addEventListener('keydown', (e) => this.#onKey(e, true), { passive: false });
    window.addEventListener('keyup', (e) => this.#onKey(e, false));
  }

  #onKey(e, down) {
    const map = {
      Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyX: 'jump',
      ArrowDown: 'slide', KeyS: 'slide',
      Escape: 'pause', KeyP: 'pause',
    };
    const action = map[e.code];
    if (action) {
      e.preventDefault();
      down ? this.press(action) : this.release(action);
      this.#fire();
    }
    if (down && e.code === 'KeyM') events.emit('audio:toggle');
  }

  /** Первый жест — разблокируем Web Audio. */
  #fire() {
    if (!this.#firstInteraction) {
      this.#firstInteraction = true;
      AudioManager.instance.unlock();
      events.emit('input:first');
    }
  }

  /** Виртуальное нажатие (из TouchControls или клавиатуры). */
  press(action) {
    if (!this.#held[action]) {
      this.#held[action] = true;
      this.#pressed.add(action);
      this.#fire();
    }
  }

  /** Виртуальное отпускание. */
  release(action) {
    if (this.#held[action]) {
      this.#held[action] = false;
      this.#released.add(action);
    }
  }

  /** Кнопка удерживается. */
  isDown(action) { return !!this.#held[action]; }

  /** Кнопка была нажата в этом кадре. */
  wasPressed(action) { return this.#pressed.has(action); }

  /** Кнопка была отпущена в этом кадре. */
  wasReleased(action) { return this.#released.has(action); }

  /** Сброс «кадровых» событий — вызывается в конце кадра. */
  endFrame() {
    this.#pressed.clear();
    this.#released.clear();
  }

  /**
   * Мультитач: привязать указатель к действию на время касания.
   * Возвращает функцию, отпускающую действие (для pointerup/cancel).
   */
  bindPointer(pointerId, action) {
    this.press(action);
    this.#pointers.set(pointerId, action);
    return () => {
      if (this.#pointers.get(pointerId) === action) {
        this.#pointers.delete(pointerId);
        this.release(action);
      }
    };
  }
}

</script>

  <script>
/* ==== js/gfx/PixelFont.js ==== */
/**
 * PixelFont — растровый шрифт 5x7 в духе 8-битных консолей.
 * Каждый глиф — 7 строк по 5 бит; текст рисуется пиксельными
 * прямоугольниками, поэтому остаётся чётким при любом масштабе.
 */
class PixelFont {
  static DATA = {

    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < row.length; x++) {
        const color = isNew ? pal[parseInt(row[x], 36)] : pal[row[x]];
        if (color) {
          ctx.fillStyle = color;
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
    return cv;
  }

  /** Получить канвас по имени (с кэшированием). */
  static get(name) {
    if (!SpriteStore.#cache.has(name)) {
      const map = SpriteStore.MAPS[name];
      if (!map) throw new Error('Нет спрайта: ' + name);
      SpriteStore.#cache.set(name, SpriteStore.#build(map));
    }
    return SpriteStore.#cache.get(name);
  }

  /**
   * Зеркальная версия (враги смотрят «на себя» — влево).
   * Паттерн «Декоратор»: оборачивает канвас, не меняя оригинал.
   */
  static getFlipped(name) {
    const key = name + '#flip';
    if (!SpriteStore.#cache.has(key)) {
      const src = SpriteStore.get(name);
      const cv = document.createElement('canvas');
      cv.width = src.width; cv.height = src.height;
      const ctx = cv.getContext('2d');
      ctx.translate(src.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(src, 0, 0);
      SpriteStore.#cache.set(key, cv);
    }
    return SpriteStore.#cache.get(key);
  }
}

// Карты из PNG (tools/artgen/png_to_maps.py) перекрывают старые
// рисованные вручную — общий пиксель-арт с Godot-ремейком.
if (typeof GENERATED_MAPS !== 'undefined') Object.assign(SpriteStore.MAPS, GENERATED_MAPS);

  <script>
/* ==== js/entities/Entity.js ==== */
/**
 * Entity — абстрактный базовый класс всех игровых объектов.
 *
 * ООП-принципы здесь:
 *  • Абстракция  — update()/draw() объявлены, но не реализованы:
 *                  каждый потомок сам решает, как он живёт и рисуется.
 *  • Инкапсуляция — координаты, размер и состояние «мёртвости» скрыты
 *                  за приватными полями; наружу — только геттеры.
 *  • Наследование — Player, Enemy, Obstacle, Item наследуют этот класс
 *                  и переопределяют виртуальные методы (полиморфизм).
 */
class Entity {
  #x;
  #y;
  #w;
  #h;
  #dead = false;
  #world = null;

  constructor(x, y, w, h) {
    this.#x = x;
    this.#y = y;
    this.#w = w;
    this.#h = h;
  }

  get x() { return this.#x; }
  set x(v) { this.#x = v; }
  get y() { return this.#y; }
  set y(v) { this.#y = v; }
  get w() { return this.#w; }
  set w(v) { this.#w = v; }
  get h() { return this.#h; }
  set h(v) { this.#h = v; }

  get world() { return this.#world; }
  set world(v) { this.#world = v; }

  get isDead() { return this.#dead; }

  /** Пометить сущность удалённой. */
  kill() { this.#dead = true; }

  /** Хитбокс для столкновений. Некоторые объекты переопределяют. */
  get hitbox() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }

  /** Пересекается ли с другой сущностью. */
  overlaps(other) { return rectsOverlap(this.hitbox, other.hitbox); }

  /** Обновление состояния (каждый кадр). */
  update(dt) { /* абстрактно */ }

  /** Отрисовка (каждый кадр). */
  draw(ctx, cam) { /* абстрактно */ }

  /**
   * Универсальный рисунок спрайта (порт Godot Art.make_sprite).
   * Якорь задаётся в МИРОВЫХ пикселях — так же, как sprite.position
   * в Godot: левый верх рисунка = позиция сущности + (ax, ay).
   * @param {CanvasRenderingContext2D} ctx
   * @param {{x:number,y:number}} cam   камера
   * @param {string} name   имя спрайта в SpriteStore
   * @param {number} ax     смещение по X, мировых пикселей
   * @param {number} ay     смещение по Y
   * @param {boolean} flip  зеркально отразить (враги смотрят «на себя»)
   * @param {number} scale  арт-пикселей в мировой единице:
   *                        1 — персонажи/предметы, 0.5 — препятствия/декор
   */
  drawSprite(ctx, cam, name, ax = 0, ay = 0, flip = false, scale = 1) {
    const sprite = flip ? SpriteStore.getFlipped(name) : SpriteStore.get(name);
    const dw = sprite.width * scale;
    const dh = sprite.height * scale;
    const dx = Math.round(this.x + ax - cam.x);
    const dy = Math.round(this.y + ay - cam.y);
    ctx.drawImage(sprite, 0, 0, sprite.width, sprite.height, dx, dy, dw, dh);
  }

  /** Камера «следит» за игроком вертикально, если он падает в яму. */
  get isProjectile() { return false; }
  get damageOnTouch() { return false; }
  get stompable() { return false; }
}

</script>
  <script>
/* ==== js/entities/Player.js ==== */
/**
 * Player — главный герой в духе Индианы Джонса.
 *
 * Наследует Entity и переопределяет update()/draw() (полиморфизм).
 * Инкапсуляция: вся физика (вертикальная скорость, прыжки, скольжение,
 * здоровье) спрятана за приватными полями.
 *
 * Механики паркура:
 *  • прыжок (с «кайот-таймом» и буфером нажатия — как в хороших платформерах)
 *  • двойной прыжок
 *  • скольжение под низкими брёвнами (пока кнопка удерживается)
 *  • прыжок на голову врага (stomp) с отскоком
 */
class Player extends Entity {
  static STAND_H = 16;
  static SLIDE_H = 7;
  static STAND_W = 10;
  static SLIDE_W = 12;
  static SLIDE_MAX = 5;        // с — максимум непрерывного скольжения
  static SLIDE_COOLDOWN = 0.8; // с — пауза после лимита до следующего приседа

  #vy = 0;
  #onGround = true;
  #jumpsLeft = 1;
  #coyote = 0;
  #buffer = 0;
  #sliding = false;
  #slideTime = 0;      // сколько секунд уже скользим (лимит SLIDE_MAX)
  #slideCooldown = 0;  // пауза после лимита — чтобы нельзя было «шагать» приседом
  #invuln = 0;
  #knock = 0;
  #animTime = 0;
  #lives;
  #maxLives;
  #dustTimer = 0;
  #dead = false;

  constructor(x, y) {
    super(x, y, Player.STAND_W, Player.STAND_H);
    this.#lives = CONFIG.START_LIVES;
    this.#maxLives = CONFIG.START_LIVES;
  }

  get vy() { return this.#vy; }
  get onGround() { return this.#onGround; }
  get sliding() { return this.#sliding; }
  get invulnerable() { return this.#invuln > 0; }
  get lives() { return this.#lives; }
  get isDown() { return this.#dead; }
  get invulnTime() { return this.#invuln; }

  /** Сброс всех состояний (рестарт уровня/игры). */
  reset(x, y) {
    this.x = x; this.y = y;
    this.w = Player.STAND_W; this.h = Player.STAND_H;
    this.#vy = 0; this.#onGround = true; this.#jumpsLeft = 1;
    this.#coyote = 0; this.#buffer = 0; this.#sliding = false;
    this.#slideTime = 0; this.#slideCooldown = 0;
    this.#invuln = 0; this.#knock = 0; this.#dead = false;
    this.#lives = this.#maxLives;
  }

  /** Нанести урон (шипы, враги, статуя). */
  takeDamage(amount = 1) {
    if (this.#invuln > 0 || this.#dead) return false;
    this.#lives -= amount;
    this.#invuln = CONFIG.INVULN_TIME;
    this.#knock = CONFIG.KNOCKBACK_TIME;
    this.#vy = -160;
    events.emit('player:hurt');
    if (this.#lives <= 0) {
      this.#lives = 0;
      this.#dead = true;
      events.emit('player:dead');
    }
    return true;
  }

  /** Подобрать сердечко. */
  heal() {
    if (this.#lives < this.#maxLives) {
      this.#lives++;
      return true;
    }
    return false;
  }

  /** Отскок после прыжка на врага. */
  bounce() {
    this.#vy = CONFIG.STOMP_BOUNCE;
    this.#jumpsLeft = 1;
  }

  /** Возрождение после падения в яму (в мире — рядом с ямой). */
  respawn(x) {
    this.x = x;
    this.y = CONFIG.GROUND_Y - this.h;
    this.#vy = 0;
    this.#onGround = true;
    this.#invuln = Math.max(this.#invuln, CONFIG.INVULN_TIME);
  }

  #tryJump() {
    if (this.#onGround || this.#coyote > 0) {
      this.#vy = CONFIG.JUMP_VELOCITY;
      this.#onGround = false;
      this.#coyote = 0;
      this.#jumpsLeft = 1;
      this.#stopSlide();
      events.emit('player:jump');
      return true;
    }
    if (this.#jumpsLeft > 0) {
      this.#vy = CONFIG.JUMP_VELOCITY * CONFIG.DOUBLE_JUMP_FACTOR;
      this.#jumpsLeft--;
      events.emit('player:doubleJump');
      return true;
    }
    return false;
  }

  #startSlide() {
    if (this.#sliding || this.#slideCooldown > 0) return;
    this.#sliding = true;
    this.#slideTime = 0;
    this.y += Player.STAND_H - Player.SLIDE_H;
    this.h = Player.SLIDE_H;
    this.w = Player.SLIDE_W;
    events.emit('player:slide');
  }

  #stopSlide() {
    if (!this.#sliding) return;
    this.#sliding = false;
    this.y -= Player.STAND_H - Player.SLIDE_H;
    this.h = Player.STAND_H;
    this.w = Player.STAND_W;
  }

  update(dt, input) {
    if (this.#dead) {
      this.#vy += CONFIG.GRAVITY * dt;
      this.y += this.#vy * dt;
      // труп ложится на землю и замирает — камера не летит за ним вниз
      if (this.y + this.h >= CONFIG.GROUND_Y) {
        this.y = CONFIG.GROUND_Y - this.h;
        this.#vy = 0;
      }
      return;
    }

    // --- горизонталь: герой автоматически бежит вправо ---
    let speed = this.world.speed;
    if (this.#knock > 0) speed *= 0.55;
    this.x += speed * dt;

    // --- буфер нажатия и кайот-тайм ---
    if (input.wasPressed('jump')) this.#buffer = CONFIG.JUMP_BUFFER;
    if (this.#buffer > 0) {
      if (this.#tryJump()) this.#buffer = 0;
    }
    this.#buffer = Math.max(0, this.#buffer - dt);
    this.#coyote = Math.max(0, this.#coyote - dt);

    // --- скольжение (кнопка удерживается; вставать под бревном нельзя;
    //     непрерывное скольжение ограничено SLIDE_MAX секундами) ---
    if (this.#onGround && input.isDown('slide') && !input.wasPressed('jump')) this.#startSlide();
    else if (this.#sliding && !input.isDown('slide') && !this.world.hasOverhead(this)) this.#stopSlide();
    if (this.#sliding) {
      this.#slideTime += dt;
      if (this.#slideTime >= Player.SLIDE_MAX && !this.world.hasOverhead(this)) {
        this.#stopSlide();
        this.#slideCooldown = Player.SLIDE_COOLDOWN;
      }
    }
    this.#slideCooldown = Math.max(0, this.#slideCooldown - dt);

    // --- гравитация ---
    this.#vy += CONFIG.GRAVITY * dt;
    this.y += this.#vy * dt;

    const feetX = this.x + this.w * 0.5;
    const hasGround = this.world.isGroundAt(feetX);
    if (hasGround && this.y + this.h >= CONFIG.GROUND_Y && this.#vy >= 0) {
      const wasAir = !this.#onGround;
      this.y = CONFIG.GROUND_Y - this.h;
      this.#vy = 0;
      this.#onGround = true;
      this.#jumpsLeft = 1;
      if (wasAir) events.emit('player:land');
    } else {
      this.#onGround = false;
    }

    // --- падение в яму (урон НАНОСИМ ДО возрождения: respawn ставит
    //     неуязвимость, и takeDamage после него заблокировался бы) ---
    if (this.y > CONFIG.GROUND_Y + 90) {
      events.emit('player:fall');
      const respawnX = this.world.findSafeGround(this.x);
      this.takeDamage(1);
      this.respawn(respawnX);
    }

    // --- таймеры ---
    this.#invuln = Math.max(0, this.#invuln - dt);
    this.#knock = Math.max(0, this.#knock - dt);
    this.#animTime += dt;

    // --- пыль под ногами и от скольжения ---
    this.#dustTimer -= dt;
    if (this.#dustTimer <= 0) {
      if (this.#sliding) {
        this.world.spawnParticles(this.x, this.y + this.h, '#d9c9a3', 2, -60);
        this.#dustTimer = 0.06;
      } else if (this.#onGround) {
        this.world.spawnParticles(this.x, this.y + this.h - 1, '#c7b58d', 1, -30);
        this.#dustTimer = 0.18;
      } else {
        this.#dustTimer = 0.2;
      }
    }
  }

  /** Какой кадр анимации показывать. Мигание при неуязвимости НЕ
   *  используется (фидбэк дают звук + HUD-вспышка), как в Godot. */
  get frame() {
    if (this.#dead) return 'player_dead';
    if (this.#sliding) return 'player_slide';
    if (!this.#onGround) return 'player_jump';
    if (this.#invuln > 0.9) return 'player_hurt';
    return 'player_run_' + (Math.floor(this.#animTime * 12) % 8);
  }

  draw(ctx, cam) {
    // Спрайт 16x18: якорь таков, что НИЗ рисунка совпадает с низом
    // хитбокса — герой стоит на земле, а не «тонет» в грунте
    // (те же якоря, что в Godot Player: -3/-2 и слайд -2/-11).
    const slide = this.#sliding;
    this.drawSprite(ctx, cam, this.frame, slide ? -2 : -3, slide ? Player.SLIDE_H - 18 : -2, false);
  }
}

</script>

/* ==== js/entities/enemies/Enemy.js ==== */
/**
 * Enemy — абстрактный базовый класс врагов.
 *
 * Наследует Entity; конкретные враги (змея, ягуар, летучая мышь, воин)
 * наследуют этот класс и реализуют собственные update()/draw() —
 * пример полиморфизма: World вызывает их «не зная» кто это.
 */
class Enemy extends Entity {
  #animTime = 0;
  #stomped = false;
  #flash = 0;
  #falling = false;
  #fallVy = 0;

  constructor(x, y, w, h) {
    super(x, y, w, h);
    this.world = null;
  }

  get damageOnTouch() { return !this.#falling; }
  get stompable() { return !this.#stomped && !this.#falling; }
  get animTime() { return this.#animTime; }
  get falling() { return this.#falling; }
  /** Летает ли враг (летучие мыши спокойно летают над ямами). */
  get flies() { return false; }

  /** Игрок прыгнул на голову: враг побеждён (исчезает с искрами). */
  onStomp(player) {
    this.#stomped = true;
    this.#flash = 0.12;
    this.world.spawnParticles(this.x + this.w / 2, this.y + this.h / 2, '#f2e2b0', 8, -80);
    events.emit('enemy:stomped', { enemy: this });
    this.kill(); // победа «в прыжке» — враг умирает и исчезает
  }

  /** Игрок коснулся сбоку: враг «уходит», игрок получает урон (World решает). */
  onHit(player) { /* по умолчанию враг выживает */ }

  /** Тик анимации для потомков. */
  tick(dt) { this.#animTime += dt; }

  /**
   * Наземные враги у края ямы проваливаются в неё: начинают падать,
   * теряют способность наносить урон и исчезают в бездне.
   * Возвращает true, пока враг падает (потомки прерывают update).
   */
  groundFall(dt) {
    if (this.#falling) {
      this.#fallVy += CONFIG.GRAVITY * dt;
      this.y += this.#fallVy * dt;
      if (this.y > CONFIG.GROUND_Y + 80) this.kill();
      return true;
    }
    if (this.world && !this.world.isGroundAt(this.x + this.w / 2)) {
      this.#falling = true;
      this.#fallVy = 0;
    }
    return false;
  }

  /** Кадр по прошедшему времени: переключение раз в `interval` секунд. */
  frameBy(interval, count, prefix) {
    return prefix + (Math.floor(this.#animTime / interval) % count);
  }
}

    if (this.x < this.world.camera.x - 40) this.kill();

/* ==== js/entities/enemies/Jaguar.js ==== */
/**
 * Jaguar — крупный ягуар в полный рост (12px — «на уровне» героя):
 * мирно стоит, затем бросается на героя. Побеждается прыжком на голову.
 * Демонстрирует «триггерное» поведение.
 */
class Jaguar extends Enemy {
  static TRIGGER_RANGE = 250; // px — замечает героя раньше и бросается раньше
  static CHARGE_ACCEL = 520;  // px/с^2 — разгон быстрее
  static CHARGE_MAX = 205;    // px/с — и максимальная скорость выше

  #chargeSpeed = 0;
  #charging = false;

  constructor(x) {
    // хитбокс 14px — по ширине видимого тела (с хвостом арт ещё шире)
    super(x, CONFIG.GROUND_Y - 12, 14, 12);
  }

  update(dt) {
    this.tick(dt);
    if (this.groundFall(dt)) return;   // у края ямы — проваливается в неё
    const player = this.world.player;
    const dx = player.x - this.x;

    if (!this.#charging && dx < Jaguar.TRIGGER_RANGE && dx > -30) {
      this.#charging = true;
      events.emit('enemy:alert', { enemy: this });
    }

    if (this.#charging) {
      this.#chargeSpeed = Math.min(Jaguar.CHARGE_MAX, this.#chargeSpeed + Jaguar.CHARGE_ACCEL * dt);
      this.x -= this.#chargeSpeed * dt;
      // пыль под лапами
      if (Math.floor(this.#chargeSpeed * dt * 10) % 3 === 0) {
        this.world.spawnParticles(this.x + 4, CONFIG.GROUND_Y - 1, '#c7b58d', 1, -20);
      }
    }
    if (this.x < this.world.camera.x - 40) this.kill();
  }

  draw(ctx, cam) {
    // кадры бега 1..5 при разгоне, покой — кадр 0 (как в Godot Jaguar)
    const frame = this.#charging
      ? 'jaguar_' + (1 + Math.floor(this.animTime / 0.09) % 5)
      : 'jaguar_0';
    // якорь (-1,-2): арт 16x14 центрируется, низ лап ровно на земле
    this.drawSprite(ctx, cam, frame, -1, -2, true);
  }
}

class Bat extends Enemy {

  static AMPLITUDE = 3; // px — лёгкое покачивание (крылья машут кадрами)

  #baseY;
  #phase;
  #amp;

  /**
   * @param {number} x мировая X
   * @param {number} altitude высота полёта над землёй (19 — на уровне головы;
   *   нижняя точка мыши (141) не задевает скользящего героя, а верхняя (135)
   *   гарантированно пересекается с бегущим)

/* ==== js/entities/enemies/Warrior.js ==== */
/**
 * Warrior — воин племени: стоит на месте, замечает героя и метает
 * копьё на уровне пояса. Копьё нужно перепрыгнуть; самого воина
 * можно обыграть стомпом.
 */
class Warrior extends Enemy {
  static ALERT_RANGE = 170;
  static WINDUP = 0.45;   // с — замах
  static COOLDOWN = 1.7;  // с — пауза между бросками
  static SPEAR_ALTITUDE = 11;

  #state = 'idle';        // idle | windup | throw
  #timer = 0;

  constructor(x) {
    // хитбокс 13px — по видимому телу с диадемой (арт 16x15)
    super(x, CONFIG.GROUND_Y - 15, 13, 15);
  }

  update(dt) {
    this.tick(dt);
    if (this.groundFall(dt)) return;   // у края ямы — проваливается в неё
    const player = this.world.player;
    const dx = player.x - this.x;

    switch (this.#state) {
      case 'idle':
        if (this.#timer <= 0 && dx < Warrior.ALERT_RANGE && dx > 40) {
          this.#state = 'windup';
          this.#timer = Warrior.WINDUP;
          events.emit('enemy:alert', { enemy: this });
        }
        break;
      case 'windup':
        this.#timer -= dt;
        if (this.#timer <= 0) {
          this.#state = 'throw';
          this.#timer = 0.15;
          this.world.spawnProjectile(new Spear(
            this.x - 6,
            CONFIG.GROUND_Y - Warrior.SPEAR_ALTITUDE,
          ));
          events.emit('warrior:throw');
        }
        break;
      case 'throw':
        this.#timer -= dt;
        if (this.#timer <= 0) {
          this.#state = 'idle';
          this.#timer = Warrior.COOLDOWN;
        }
        break;
    }

    if (this.#state === 'idle' && this.#timer > 0) this.#timer -= dt;
    if (this.x < this.world.camera.x - 40) this.kill();
  }

  draw(ctx, cam) {
    // кадры: 0/1 — покой, 2 — замах, 3 — бросок (как в Godot Warrior)
    const frame = this.#state === 'windup' ? 'warrior_2'
      : this.#state === 'throw' ? 'warrior_3'
      : this.frameBy(0.6, 2, 'warrior_');
    // якорь (-1.5,0): арт 16x15 центрируется, ступни ровно на земле
    this.drawSprite(ctx, cam, frame, -1.5, 0, true);
  }
}

/* ==== js/entities/obstacles/LowLog.js ==== */
/**
 * LowLog — базовый класс «подвешенных» препятствий (порт Godot Overhead):
 * деревянное бревно, жгут лиан, верёвка-ловушка, каменная балка.
 *
 * Висят над землёй (под ним можно проскользнуть, а прыжок врезается),
 * слегка покачиваются и тянутся канатами к кроне/потолку за верх экрана —
 * как в Godot и в web-версии.
 *
 * Рисунок — спрайт из общего пиксель-арта в масштабе 0.5 (2 арт-пикселя
 * на мировую единицу): визуал совпадает с хитбоксом (контракт «хитбокс
 * ≈ визуал»). Потомки задают арт/цвет каната через конструктор.
 */
class LowLog extends Obstacle {
  static SWAY = 0.8;    // амплитуда покачивания, мировых px
  static HANG_TO = -2;  // линии подвеса идут к самому верху экрана

  #art;
  #swayT;

  /**
   * @param {number} x     мировая X
   * @param {string} art   имя спрайта (log1 | log2 | vine1 | ropetrap | stonebeam)
   * @param {number} w     ширина хитбокса
   * @param {number} h     высота хитбокса
   * @param {number} y     верх хитбокса
   */
  constructor(x, art = 'log1', w = 24, h = 9, y = CONFIG.GROUND_Y - 18) {
    super(x, y, w, h);
    this.#art = art;
    this.#swayT = x * 0.07; // у каждой пары — своя фаза покачивания
    this.ropeColor = '#d9b382'; // цвет каната (потомки переопределяют)
    this.isChain = false;       // цепь со «звеньями» вместо гладкого каната
  }

  get isOverhead() { return true; }

  /** Хитбокс чуть уже рисунка (как в Godot): край арта не «бьёт» зря. */
  get hitbox() {
    return { x: this.x, y: this.y + 1, w: this.w, h: this.h - 2 };
  }

  update(dt) {
    this.#swayT += dt;
  }

  draw(ctx, cam) {
    const x = Math.round(this.x - cam.x);
    const y = Math.round(this.y - cam.y);

    // канаты/цепи от верха экрана до верха спрайта (арт-якорь ay = +1)
    const ytop = Math.round(LowLog.HANG_TO - cam.y);
    const bottom = y + 1;
    if (bottom > ytop) {
      for (const lx of [2, this.w - 3]) {
        ctx.fillStyle = this.ropeColor;
        ctx.fillRect(x + lx, ytop, 1, bottom - ytop);
        if (this.isChain) {
          ctx.fillStyle = '#8d8f9c';
          for (let yy = ytop + 1; yy < bottom; yy += 4) {
            ctx.fillRect(x + lx, yy, 1, 2);
          }
        }
      }
    }

    // спрайт: покачивание ±SWAY по X; низ арта = низ хитбокса + 1
    const sway = LowLog.SWAY * Math.sin(this.#swayT * 1.7);
    this.drawSprite(ctx, cam, this.#art, sway, 1, false, 0.5);
  }
}

/* ==== js/world/Biome.js ==== */
/**
 * Biome — абстрактный базовый класс локаций (джунгли, деревня, храм).
 *
 * Каждый биом инкапсулирует:
 *  • палитру (небо, земля),
 *  • процедурный параллакс-фон (свои силуэты),
 *  • таблицу «паттернов» препятствий/врагов для генератора уровней,
 *  • название и музыкальный трек.
 *
 * Абстракция + полиморфизм: World вызывает drawBackground()/getPattern(),
 * не зная, какая именно локация рисуется.
 */
class Biome {
  constructor(seed = 1) {
    this.rng = makeRandom(seed);
    this.time = 0;
  }

  /** Название локации для HUD. */
  get name() { return 'BIOME'; }
  /** Музыкальный трек. */
  get track() { return 'jungle'; }
  /** Цвет неба сверху/снизу. */
  get skyTop() { return '#000'; }
  get skyBottom() { return '#000'; }
  /** Палитра земли: трава/камень, грунт, тени. */
  get groundTop() { return '#000'; }
  get groundDirt() { return '#000'; }
  get groundShade() { return '#000'; }
  get groundLine() { return '#000'; }

  /** Сообщение при входе в биом. */
  get message() { return this.name; }

  /** Фон (дальний план) — абстрактно. */
  drawBackground(ctx, cam) { /* абстрактно */ }

  /** Передний план поверх земли/сущностей — по умолчанию пусто. */
  drawForeground(ctx, cam) { /* опционально */ }

  /** Тик времени для анимаций фона. */
  tick(dt) { this.time += dt; }

  /**
   * Паттерн генерации следующего «участка» трассы.
   * @param {number} difficulty 0..1 — растёт с расстоянием
   * @returns {{length:number, spawns:Array, items:Array}}
   */
  getPattern(difficulty) { /* абстрактно */ return { length: 120, spawns: [], items: [] }; }

  /** Универсальный помощник: выбрать объект из таблицы с весами. */
  static weightedPick(rng, table) {
    let total = 0;
    for (const e of table) total += e.weight;
    let r = rng() * total;
    for (const e of table) {
      r -= e.weight;
      if (r <= 0) return e.value;
    }
    return table[table.length - 1].value;
  }

  /** Ряд золотых идолов дугой (награда за рискованный прыжок). */
  static idolArc(x0, count, alt = 42, gap = 12) {
    const items = [];
    for (let i = 0; i < count; i++) {
      const lift = count > 1 ? Math.sin((i / (count - 1)) * Math.PI) * 10 : 0;
      items.push({ type: 'idol', at: x0 + i * gap, alt: alt + lift });
    }
    return items;
  }

  /**
   * Параллакс-слой с бесшовным повтором: baseItems описаны внутри
   * периода `period`, а drawFn рисует каждый элемент на экране.
   */
  static parallax(ctx, cam, factor, period, baseItems, drawFn) {
    const off = (cam.x * factor) % period;
    for (const it of baseItems) {
      let x = it.x - off;
      if (x < 0) x += period;
      for (let rep = -1; rep <= 1; rep++) {
        const sx = x + rep * period;
        if (sx > -140 && sx < CONFIG.WIDTH + 140) drawFn(ctx, Math.round(sx), it);
      }
    }
  }
}

</script>

    this.clouds = [];
    for (let i = 0; i < 6; i++) {
      this.clouds.push({ x: i * 54 + rng() * 26, y: 12 + rng() * 24, w: 30 + rng() * 30, h: 6 + rng() * 4 });
    }

    this.farMountains = [];
    for (let i = 0; i < 7; i++) {
      this.farMountains.push({ x: i * 50 + rng() * 16, w: 44 + rng() * 30, h: 34 + rng() * 26, fall: rng() > 0.6 });
    }

    this.nearMountains = [];
    for (let i = 0; i < 6; i++) {
      this.nearMountains.push({ x: i * 56 + rng() * 20, w: 50 + rng() * 26, h: 22 + rng() * 18 });
    }

    this.trees = [];
    for (let i = 0; i < 9; i++) {
      this.trees.push({
        x: i * 36 + rng() * 14,
        kind: Math.floor(rng() * 3),               // 0 — широкая крона, 1 — пальма, 2 — сухое дерево
        h: 26 + rng() * 18,
        w: 16 + rng() * 12,
      });
    }

    this.bushes = [];
    for (let i = 0; i < 10; i++) {
      this.bushes.push({ x: i * 32 + rng() * 12, w: 10 + rng() * 12, h: 6 + rng() * 5 });
    }

    this.canopy = [];
    for (let i = 0; i < 12; i++) {
      this.canopy.push({ x: i * 27 + rng() * 9, r: 9 + rng() * 9, vines: rng() > 0.45 ? 2 + Math.floor(rng() * 3) : 0 });
    }

    this.birds = [];
    for (let i = 0; i < 3; i++) {
      this.birds.push({ x: i * 110 + rng() * 40, y: 24 + rng() * 30, speed: 14 + rng() * 10, phase: rng() * 6 });
    }

    // бабочки над травой (передний план)
    this.flutters = [];
    for (let i = 0; i < 3; i++) {
      this.flutters.push({
        x: i * 97 + rng() * 60,
        y: 78 + rng() * 52,
        phase: rng() * 6,
        color: rng() > 0.5 ? '#ffd45e' : '#f2f0dc',
      });
    }

    // папоротники, грибы и цветы вдоль земли (нарисованы поверх героя — глубина)
    this.ferns = [];
    for (let i = 0; i < 14; i++) {
      this.ferns.push({ x: i * 25 + rng() * 10, kind: Math.floor(rng() * 3) });
    }
  }

  get name() { return 'ДЖУНГЛИ'; }
  get track() { return 'jungle'; }
  get skyTop() { return '#3f9fd8'; }
  get skyBottom() { return '#a9dba4'; }
  get groundTop() { return '#4e9a3f'; }
  get groundDirt() { return '#6b4a25'; }
  get groundShade() { return '#54381b'; }
  get groundLine() { return '#2f6b28'; }

  drawBackground(ctx, cam) {
    const W = CONFIG.WIDTH, H = CONFIG.HEIGHT, GY = CONFIG.GROUND_Y;
    const t = this.time;

    // --- небо с градиентом ---
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, this.skyTop);
    g.addColorStop(0.65, '#7fc4b8');
    g.addColorStop(1, this.skyBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // --- солнце с ореолом ---
    const sunX = 250 - ((cam.x * 0.04) % 640);
    ctx.fillStyle = 'rgba(255,240,170,0.25)';
    ctx.fillRect(sunX - 22, 12, 44, 44);
    ctx.fillStyle = 'rgba(255,240,170,0.45)';
    ctx.fillRect(sunX - 17, 17, 34, 34);
    ctx.fillStyle = '#ffe98a';
    ctx.fillRect(sunX - 13, 21, 26, 26);
    ctx.fillStyle = '#fff6c2';
    ctx.fillRect(sunX - 8, 26, 16, 16);

    // --- облака (двухслойные) ---
    Biome.parallax(ctx, cam, 0.06, 324, this.clouds, (ctx2, x, c) => {
      ctx2.fillStyle = '#eef7ef';
      ctx2.fillRect(x, c.y, c.w, c.h);
      ctx2.fillRect(x + 6, c.y - 4, c.w - 16, 5);
      ctx2.fillStyle = '#d4e8d8';
      ctx2.fillRect(x + 2, c.y + c.h, c.w - 6, 2);
    });

    // --- дальние горы с водопадами ---
    Biome.parallax(ctx, cam, 0.13, 350, this.farMountains, (ctx2, x, m) => {
      const base = GY + 4; // низ гор уходит под землю — не «парят»
      for (let k = 0; k < m.h; k++) {
        const w = Math.round(m.w * (1 - 0.85 * (k / m.h)));
        ctx2.fillStyle = k > m.h * 0.6 ? '#2f6b63' : '#3d7f74';
        ctx2.fillRect(x + Math.round((m.w - w) / 2), base - k, w, 1);
      }
      // водопад, стекающий со скалы
      if (m.fall) {
        const fx = x + Math.round(m.w / 2) - 1;
        for (let k = 0; k < 26; k++) {
          const shimmer = (Math.floor(t * 14) + k) % 3;
          ctx2.fillStyle = shimmer === 0 ? '#bfe8f0' : '#8fd0e0';
          ctx2.fillRect(fx + (k % 2), base - 26 + k, 2, 1);
        }
        // брызги внизу
        ctx2.fillStyle = '#d8f0f4';
        ctx2.fillRect(fx - 3, base - 2, 8, 2);
      }
    });

    // --- полоса тумана у подножия ---
    ctx.fillStyle = 'rgba(210,235,220,0.35)';
    ctx.fillRect(0, GY - 26, W, 8);
    ctx.fillStyle = 'rgba(210,235,220,0.2)';
    ctx.fillRect(0, GY - 20, W, 6);

    // --- ближние холмы ---
    Biome.parallax(ctx, cam, 0.22, 336, this.nearMountains, (ctx2, x, m) => {
      const base = GY + 3; // холмы сидят на земле
      for (let k = 0; k < m.h; k++) {
        const w = Math.round(m.w * (1 - 0.9 * (k / m.h)));
        ctx2.fillStyle = k > m.h * 0.5 ? '#2b5f3f' : '#35704a';
        ctx2.fillRect(x + Math.round((m.w - w) / 2), base - k, w, 1);
      }
    });

    // --- деревья трёх видов ---
    Biome.parallax(ctx, cam, 0.38, 324, this.trees, (ctx2, x, tr) => {
      const base = GY + 2; // стволы стоят на земле
      if (tr.kind === 0) {
        // широкая тропическая крона
        ctx2.fillStyle = '#4a3520';
        ctx2.fillRect(x + 3, base - tr.h, 4, tr.h);
        ctx2.fillStyle = '#276b34';
        ctx2.fillRect(x - tr.w / 2 + 3, base - tr.h - 10, tr.w, 12);
        ctx2.fillRect(x - tr.w / 4 + 3, base - tr.h - 16, tr.w / 2, 8);
        ctx2.fillStyle = '#3fae4a';
        ctx2.fillRect(x - tr.w / 3 + 3, base - tr.h - 12, tr.w / 2, 6);
        ctx2.fillStyle = '#57c25c';
        ctx2.fillRect(x - tr.w / 4 + 3, base - tr.h - 15, 4, 3);
      } else if (tr.kind === 1) {
        // пальма
        ctx2.fillStyle = '#6b5030';
        for (let k = 0; k < tr.h; k++) ctx2.fillRect(x + 2 + Math.round(Math.sin(k / 9) * 3), base - k, 2, 1);
        const topX = x + 2 + Math.round(Math.sin(tr.h / 9) * 3);
        ctx2.fillStyle = '#2f7a3a';
        ctx2.fillRect(topX - 8, base - tr.h - 2, 7, 2);
        ctx2.fillRect(topX + 1, base - tr.h - 2, 7, 2);
        ctx2.fillRect(topX - 5, base - tr.h - 4, 10, 2);
        ctx2.fillStyle = '#43964a';
        ctx2.fillRect(topX - 3, base - tr.h - 5, 6, 2);
      } else {
        // сухое дерево с vines
        ctx2.fillStyle = '#5c4526';
        ctx2.fillRect(x + 2, base - tr.h, 3, tr.h);
        ctx2.fillRect(x - 3, base - tr.h + 6, 6, 2);
        ctx2.fillRect(x + 4, base - tr.h + 10, 6, 2);
        ctx2.fillStyle = '#3f7a3a';
        ctx2.fillRect(x - 2, base - tr.h + 8, 1, 6);
        ctx2.fillRect(x + 8, base - tr.h + 12, 1, 8);
      }
    });

    // --- кусты у самой земли ---
    Biome.parallax(ctx, cam, 0.72, 320, this.bushes, (ctx2, x, b) => {
      const base = GY + 2; // кусты на земле, а не в воздухе
      ctx2.fillStyle = '#276b34';
      ctx2.fillRect(x, base - b.h, b.w, b.h);
      ctx2.fillRect(x + 2, base - b.h - 3, b.w - 4, 4);
      ctx2.fillStyle = '#3fae4a';
      ctx2.fillRect(x + 2, base - b.h - 1, b.w - 6, 2);
      ctx2.fillStyle = '#d94f6b';  // цветок
      if (b.w > 14) ctx2.fillRect(x + b.w - 5, base - b.h - 3, 2, 2);
    });

    // --- крона сверху с лианами ---
    Biome.parallax(ctx, cam, 0.85, 324, this.canopy, (ctx2, x, c) => {
      ctx2.fillStyle = '#1f4f26';
      ctx2.fillRect(x - c.r, 0, c.r * 2, 11);
      ctx2.fillRect(x - c.r / 2, 11, c.r, 5);
      ctx2.fillStyle = '#2b6b31';
      ctx2.fillRect(x - c.r + 3, 4, c.r, 4);
      ctx2.fillStyle = '#173d1e';
      ctx2.fillRect(x - c.r + 1, 9, 4, 2);
      // лианы, слегка покачивающиеся
      for (let v = 0; v < c.vines; v++) {
        const vx = x - c.r + 4 + v * 7;
        const sway = Math.round(Math.sin(t * 1.1 + v + x * 0.05) * 2);
        const len = 12 + (v * 5) % 14;
        ctx2.fillStyle = '#2f6b35';
        ctx2.fillRect(vx + sway, 14, 1, len);
        ctx2.fillStyle = '#4e9a3f';
        ctx2.fillRect(vx + sway - 1, 14 + len - 2, 3, 2);
      }
    });

    // --- лучи света сквозь крону ---
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#fff8d8';
    const rayShift = (cam.x * 0.5) % 90;
    for (let i = -1; i < 6; i++) {
      const rx = i * 90 - rayShift;
      ctx.beginPath();
      ctx.moveTo(rx, 0);
      ctx.lineTo(rx + 26, 0);
      ctx.lineTo(rx + 60, GY);
      ctx.lineTo(rx + 20, GY);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  drawForeground(ctx, cam) {
    const t = this.time;
    const W = CONFIG.WIDTH;
    const GY = CONFIG.GROUND_Y;

    // стайка птиц, пересекающих экран
    for (const b of this.birds) {
      const bx = ((b.x + t * b.speed) % (W + 80)) - 40;
      const by = b.y + Math.sin(t * 2 + b.phase) * 4;
      const flap = Math.floor(t * 8 + b.phase) % 2;
      ctx.fillStyle = '#1c2a24';
      ctx.fillRect(Math.round(bx), Math.round(by), 3, 1);
      ctx.fillRect(Math.round(bx) - (flap ? 2 : 1), Math.round(by) - 1, 2, 1);
      ctx.fillRect(Math.round(bx) + 2, Math.round(by) - 1, 2, 1);
    }

    // светлячки-споры
    ctx.fillStyle = '#d8f5a3';
    for (let i = 0; i < 7; i++) {
      const x = ((i * 61 + t * 10 * (i % 2 ? 1 : -1)) % (W + 40)) - 20;
      const y = 36 + Math.sin(t * 1.4 + i * 2.1) * 20 + i * 13;
      const blink = Math.floor(t * 4 + i) % 3 !== 0;
      if (blink) ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
    }

    // бабочки над травой
    for (const b of this.flutters) {
      const bx = ((b.x - t * 16) % (W + 60) + W + 60) % (W + 60) - 30;
      const by = b.y + Math.sin(t * 2.4 + b.phase) * 6;
      const flap = Math.floor(t * 10 + b.phase) % 2;
      ctx.fillStyle = b.color;
      ctx.fillRect(Math.round(bx), Math.round(by), 2, 2);
      ctx.fillRect(Math.round(bx) + (flap ? -2 : -1), Math.round(by) - 1, 2, 1);
      ctx.fillRect(Math.round(bx) + 2, Math.round(by) - 1, 2, 1);
    }

    // папоротники, грибы и цветы вдоль земли (передний план — глубина сцены)
    Biome.parallax(ctx, cam, 1.05, 350, this.ferns, (ctx2, x, f) => {
      if (f.kind === 0) {
        ctx2.fillStyle = '#2f6b35';
        ctx2.fillRect(x, GY - 6, 1, 6);
        ctx2.fillRect(x - 3, GY - 5, 3, 1);
        ctx2.fillRect(x + 1, GY - 4, 3, 1);
        ctx2.fillRect(x - 2, GY - 7, 2, 1);
        ctx2.fillStyle = '#4e9a3f';
        ctx2.fillRect(x + 1, GY - 6, 3, 1);
      } else if (f.kind === 1) {
        ctx2.fillStyle = '#efe3c8';
        ctx2.fillRect(x, GY - 4, 2, 4);
        ctx2.fillStyle = '#b03027';
        ctx2.fillRect(x - 2, GY - 7, 6, 3);
        ctx2.fillStyle = '#efe3c8';
        ctx2.fillRect(x - 1, GY - 6, 1, 1);
        ctx2.fillRect(x + 1, GY - 5, 1, 1);
      } else {
        ctx2.fillStyle = '#3fae4a';
        ctx2.fillRect(x, GY - 5, 1, 5);
        ctx2.fillRect(x + 2, GY - 4, 1, 4);
        ctx2.fillRect(x + 4, GY - 3, 1, 3);
        ctx2.fillStyle = '#d94f6b';
        ctx2.fillRect(x, GY - 7, 2, 2);
      }
    });
  }

  getPattern(d) {
    const rng = this.rng;
    const P = (weight, value) => ({ weight, value });
    // Джунгли: лианы, ямы, змеи, ягуары и летучие мыши (шипы и воины — другие локации)
    const table = [
      P(3, { length: 110, spawns: [], items: Biome.idolArc(40, 4, 30) }),
      P(3, { length: 145, spawns: [{ type: 'vine', at: 60 }], items: Biome.idolArc(50, 5, 48) }),
      P(3, {
        length: 150,
        spawns: [{ type: 'log', at: 70 }],
        items: [{ type: 'idol', at: 60, alt: 0 }, { type: 'idol', at: 72, alt: 0 }, { type: 'idol', at: 84, alt: 0 }],
      }),
      P(3, (dd) => ({
        length: 155,
        spawns: [{ type: 'pit', at: 50, w: dd > 0.55 ? 42 : 34 }],
        items: Biome.idolArc(44, 4, 46),
      })),
      P(d > 0.1 ? 2 : 0, { length: 150, spawns: [{ type: 'snake', at: 95 }], items: [] }),
      P(d > 0.3 ? 2 : 0, {
        length: 175,
        spawns: [{ type: 'vine', at: 60 }, { type: 'pit', at: 128, w: 34 }], // связка «скользи и прыгай»
        items: [],
      }),
      P(d > 0.2 ? 2 : 0, {
        length: 200,
        spawns: [{ type: 'vine', at: 60 }, { type: 'log', at: 89 }],  // длинное скольжение
        items: [{ type: 'idol', at: 56, alt: 0 }, { type: 'idol', at: 74, alt: 0 }, { type: 'idol', at: 92, alt: 0 }],
      }),
      P(d > 0.25 ? 2 : 0, (dd) => ({
        length: 165,
        spawns: dd > 0.6
          ? [{ type: 'bat', at: 95, alt: 19 }, { type: 'bat', at: 128, alt: 19 }]
          : [{ type: 'bat', at: 95, alt: 19 }],
        items: [],
      })),
      P(d > 0.4 ? 2 : 0, { length: 200, spawns: [{ type: 'jaguar', at: 150 }], items: [] }),
      P(d > 0.35 ? 1.5 : 0, {
        length: 190, spawns: [{ type: 'vine', at: 60 }, { type: 'snake', at: 134 }], items: [],
      }),
      P(d > 0.45 ? 1.5 : 0, {
        length: 190, spawns: [{ type: 'pit', at: 50, w: 34 }, { type: 'snake', at: 134 }], items: [],
      }),
      P(0.6, { length: 130, spawns: [], items: [{ type: 'heart', at: 60, alt: 32 }] }),
    ];
    const picked = Biome.weightedPick(rng, table);
    return typeof picked === 'function' ? picked(d) : picked;
  }
}

  <script>
/* ==== js/world/Village.js ==== */
/**
 * Village — деревня аборигенов: закатное небо, пальмы, хижины с дымом,
 * резные тотемы, заборы, костры с анимированным пламенем.
 * Здесь активнее воины с копьями и верёвки-ловушки.
 */
class Village extends Biome {
  constructor(seed) {
    super(seed);
    const rng = this.rng;

    this.clouds = [];
    for (let i = 0; i < 5; i++) {
      this.clouds.push({ x: i * 68 + rng() * 26, y: 12 + rng() * 22, w: 34 + rng() * 26, h: 5 + rng() * 3 });
    }

    this.farHills = [];
    for (let i = 0; i < 6; i++) {
      this.farHills.push({ x: i * 58 + rng() * 18, w: 48 + rng() * 28, h: 24 + rng() * 20 });
    }

    this.palms = [];
    for (let i = 0; i < 6; i++) {
      this.palms.push({ x: i * 54 + rng() * 20, h: 28 + rng() * 14, flip: rng() > 0.5 });
    }

    this.huts = [];
    for (let i = 0; i < 6; i++) {
      this.huts.push({ x: i * 60 + rng() * 22, w: 24 + rng() * 12, h: 15 + rng() * 7, smoke: rng() > 0.35 });
    }

    this.totems = [];
    for (let i = 0; i < 5; i++) {
      this.totems.push({ x: i * 76 + rng() * 26, h: 24 + rng() * 14 });
    }

    this.fences = [];
    for (let i = 0; i < 6; i++) {
      this.fences.push({ x: i * 50 + rng() * 18, posts: 3 + Math.floor(rng() * 3) });
    }

    this.fires = [];
    for (let i = 0; i < 4; i++) {
      this.fires.push({ x: i * 92 + rng() * 30 });
    }

    this.grass = [];
    for (let i = 0; i < 12; i++) {
      this.grass.push({ x: i * 26 + rng() * 10, h: 5 + rng() * 6 });
    }

    // сушильные стойки: ткань и рыба (мизасцена жизни деревни)
    this.racks = [];
    for (let i = 0; i < 3; i++) {
      this.racks.push({ x: i * 121 + rng() * 40, cloth: rng() > 0.5 });
    }

    // жители у хижин (каждая вторая хижина — со своим владельцем)
    this.huts.forEach((h, i) => {
      h.villager = i % 2 === 0;
    });
  }

  get name() { return 'ДЕРЕВНЯ'; }
  get track() { return 'village'; }
  get skyTop() { return '#6d3a86'; }
  get skyBottom() { return '#f7a04b'; }
  get groundTop() { return '#b98a4b'; }
  get groundDirt() { return '#8a5a2e'; }
  get groundShade() { return '#6e4522'; }
  get groundLine() { return '#5c381b'; }

  drawBackground(ctx, cam) {
    const W = CONFIG.WIDTH, GY = CONFIG.GROUND_Y;
    const t = this.time;

    // --- закатный градиент в три слоя ---
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, this.skyTop);
    g.addColorStop(0.55, '#c95e63');
    g.addColorStop(1, this.skyBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GY);

    // --- большое низкое солнце с градиентными кольцами ---
    const sunX = 200 - ((cam.x * 0.035) % 700);
    const sunY = GY - 42;
    ctx.fillStyle = 'rgba(255,210,122,0.22)';
    ctx.fillRect(sunX - 26, sunY - 26, 52, 52);
    ctx.fillStyle = 'rgba(255,210,122,0.4)';
    ctx.fillRect(sunX - 20, sunY - 20, 40, 40);
    ctx.fillStyle = '#ffd27a';
    ctx.fillRect(sunX - 15, sunY - 15, 30, 30);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillRect(sunX - 9, sunY - 9, 18, 18);

    // --- вытянутые облачка в свете заката ---
    Biome.parallax(ctx, cam, 0.07, 340, this.clouds, (ctx2, x, c) => {
      ctx2.fillStyle = '#e8a06a';
      ctx2.fillRect(x, c.y, c.w, c.h);
      ctx2.fillStyle = '#f7c38a';
      ctx2.fillRect(x + 4, c.y - 2, c.w - 12, 2);
      ctx2.fillStyle = '#b96a52';
      ctx2.fillRect(x + 2, c.y + c.h, c.w - 8, 1);
    });

    // --- дальние силуэты холмов ---
    Biome.parallax(ctx, cam, 0.12, 348, this.farHills, (ctx2, x, m) => {
      const base = GY + 3; // холмы сидят на земле
      for (let k = 0; k < m.h; k++) {
        const w = Math.round(m.w * (1 - 0.92 * (k / m.h)));
        ctx2.fillStyle = k > m.h * 0.5 ? '#5c3050' : '#6d3a5e';
        ctx2.fillRect(x + Math.round((m.w - w) / 2), base - k, w, 1);
      }
    });

    // --- пальмы ---
    Biome.parallax(ctx, cam, 0.28, 324, this.palms, (ctx2, x, p) => {
      const base = GY + 2; // пальмы стоят на земле
      const dir = p.flip ? -1 : 1;
      ctx2.fillStyle = '#5c4526';
      for (let k = 0; k < p.h; k++) {
        ctx2.fillRect(x + Math.round(Math.sin(k / 12) * 4 * dir), base - k, 2, 1);
      }
      const topX = x + Math.round(Math.sin(p.h / 12) * 4 * dir);
      ctx2.fillStyle = '#3f7a3a';
      ctx2.fillRect(topX - 9 * dir, base - p.h - 2, 8 * dir * (dir > 0 ? 1 : -1) || 8, 2);
      ctx2.fillRect(topX - 1, base - p.h - 2, 9, 2);
      ctx2.fillRect(topX - 6, base - p.h - 4, 12, 2);
      ctx2.fillStyle = '#4e9a3f';
      ctx2.fillRect(topX - 4, base - p.h - 5, 8, 2);
      // кокосы
      ctx2.fillStyle = '#6b4a25';
      ctx2.fillRect(topX - 2, base - p.h, 2, 2);
    });

    // --- хижины с соломенными крышами и дымом ---
    Biome.parallax(ctx, cam, 0.4, 360, this.huts, (ctx2, x, hut) => {
      const base = GY + 2; // хижины стоят на земле
      // стены из бамбука
      ctx2.fillStyle = '#7a5230';
      ctx2.fillRect(x, base - hut.h, hut.w, hut.h);
      ctx2.fillStyle = '#c9a86a';
      for (let i = 1; i < hut.w; i += 5) ctx2.fillRect(x + i, base - hut.h, 2, hut.h);
      ctx2.fillStyle = '#5c381b';
      ctx2.fillRect(x, base - hut.h, hut.w, 2);
      // крыша из соломы (ярусы)
      ctx2.fillStyle = '#d9b26a';
      ctx2.fillRect(x - 4, base - hut.h - 8, hut.w + 8, 8);
      ctx2.fillStyle = '#c99a4b';
      ctx2.fillRect(x - 1, base - hut.h - 12, hut.w + 2, 5);
      ctx2.fillStyle = '#e8c882';
      ctx2.fillRect(x + 2, base - hut.h - 13, hut.w - 4, 2);
      // дверь и огонёк внутри
      ctx2.fillStyle = '#3d2a17';
      ctx2.fillRect(x + hut.w / 2 - 3, base - 9, 6, 9);
      ctx2.fillStyle = '#e8a53a';
      ctx2.fillRect(x + hut.w / 2 - 2, base - 6, 4, 3);
      // дым
      if (hut.smoke) {
        for (let i = 0; i < 4; i++) {
          const rise = (t * 12 + i * 10) % 40;
          ctx2.globalAlpha = Math.max(0, 0.45 - rise / 90);
          ctx2.fillStyle = '#d8d3c8';
          const drift = Math.sin(t * 1.6 + i * 1.7) * 3;
          ctx2.fillRect(Math.round(x + hut.w / 2 + drift), Math.round(base - hut.h - 14 - rise), 3, 3);
        }
        ctx2.globalAlpha = 1;
      }

      // житель у хижины: копьё в руке, слегка покачивается
      if (hut.villager) {
        const vx = Math.round(x + hut.w + 5);
        const bob = Math.floor(t * 2 + hut.x) % 2;
        ctx2.fillStyle = '#3d2a17';          // копьё
        ctx2.fillRect(vx + 4, base - 10 - bob, 1, 10);
        ctx2.fillStyle = '#9aa3ad';          // наконечник
        ctx2.fillRect(vx + 4, base - 12 - bob, 1, 2);
        ctx2.fillStyle = '#8d5a3b';          // тело
        ctx2.fillRect(vx + 1, base - 6 - bob, 3, 4);
        ctx2.fillStyle = '#d9b26a';          // юбка из травы
        ctx2.fillRect(vx, base - 4 - bob, 4, 2);
        ctx2.fillStyle = '#a8703f';          // голова
        ctx2.fillRect(vx + 1, base - 9 - bob, 2, 3);
        ctx2.fillStyle = '#b03027';          // перо
        ctx2.fillRect(vx + 2, base - 11 - bob, 1, 2);
      }
    });

    // --- тотемные столбы с «лицами» ---
    Biome.parallax(ctx, cam, 0.52, 380, this.totems, (ctx2, x, tot) => {
      const base = GY + 2; // тотемы стоят на земле
      ctx2.fillStyle = '#8a4b23';
      ctx2.fillRect(x, base - tot.h, 9, tot.h);
      ctx2.fillStyle = '#6b3717';
      ctx2.fillRect(x + 7, base - tot.h, 2, tot.h);
      // три «лица»
      const faces = 3;
      for (let f = 0; f < faces; f++) {
        const fy = base - tot.h + 3 + f * Math.floor((tot.h - 4) / faces);
        ctx2.fillStyle = '#e0c53a';
        ctx2.fillRect(x + 1, fy, 2, 2);
        ctx2.fillRect(x + 5, fy, 2, 2);
        ctx2.fillStyle = f % 2 ? '#b03027' : '#3fae4a';
        ctx2.fillRect(x + 2, fy + 3, 4, 2);
      }
      // «волосы» из перьев
      ctx2.fillStyle = '#b03027';
      ctx2.fillRect(x - 1, base - tot.h - 4, 3, 4);
      ctx2.fillStyle = '#e0c53a';
      ctx2.fillRect(x + 3, base - tot.h - 5, 3, 5);
      ctx2.fillStyle = '#3fae4a';
      ctx2.fillRect(x + 7, base - tot.h - 4, 3, 4);
    });

    // --- заборы из кольев ---
    Biome.parallax(ctx, cam, 0.66, 300, this.fences, (ctx2, x, f) => {
      const base = GY + 2; // колья воткнуты в землю
      for (let i = 0; i < f.posts; i++) {
        const px = x + i * 8;
        ctx2.fillStyle = '#6b4a25';
        ctx2.fillRect(px, base - 9, 2, 9);
        ctx2.fillStyle = '#845c30';
        ctx2.fillRect(px, base - 9, 1, 9);
        ctx2.fillStyle = '#54381b';
        ctx2.fillRect(px, base - 10, 2, 1);
      }
      ctx2.fillStyle = '#54381b';
      ctx2.fillRect(x, base - 7, (f.posts - 1) * 8 + 2, 1);
      ctx2.fillRect(x, base - 3, (f.posts - 1) * 8 + 2, 1);
    });

    // --- костры с пламенем и световым пятном ---
    Biome.parallax(ctx, cam, 0.8, 460, this.fires, (ctx2, x, f) => {
      const base = GY + 2; // костры на самой земле
      // дрова
      ctx2.fillStyle = '#5c381b';
      ctx2.fillRect(x - 2, base - 3, 9, 2);
      ctx2.fillStyle = '#6b4a25';
      ctx2.fillRect(x, base - 4, 6, 2);
      // пламя (3 языка, анимация)
      const fl = Math.floor(t * 9 + x) % 3;
      ctx2.fillStyle = '#e07a2e';
      ctx2.fillRect(x, base - 8 - fl, 6, 5 + fl);
      ctx2.fillStyle = '#ffd27a';
      ctx2.fillRect(x + 1, base - 7 - fl, 4, 4 + fl);
      ctx2.fillStyle = '#fff3c8';
      ctx2.fillRect(x + 2, base - 5, 2, 2);
      // свет на земле
      ctx2.fillStyle = 'rgba(255,180,90,0.18)';
      ctx2.fillRect(x - 8, base, 22, 3);
    });

    // сушильные стойки: развивающаяся ткань и рыба (мизасцена деревни)
    Biome.parallax(ctx, cam, 0.4, 360, this.racks, (ctx2, x, r) => {
      const base = GY + 2;
      ctx2.fillStyle = '#6b4a25';
      ctx2.fillRect(x, base - 14, 1, 14);
      ctx2.fillRect(x + 16, base - 14, 1, 14);
      ctx2.fillRect(x, base - 14, 17, 1);
      if (r.cloth) {
        const sway = Math.round(Math.sin(t * 2 + r.x) * 2);
        ctx2.fillStyle = '#d94f6b';
        ctx2.fillRect(x + 3 + sway, base - 13, 6, 8);
        ctx2.fillStyle = '#e07a8a';
        ctx2.fillRect(x + 3 + sway, base - 13, 6, 2);
      } else {
        for (let i = 0; i < 3; i++) {
          const fy = Math.round(base - 12 + Math.sin(t * 1.5 + i + r.x));
          ctx2.fillStyle = '#9aa3ad';
          ctx2.fillRect(x + 3 + i * 4, fy, 2, 6);
          ctx2.fillStyle = '#5c5e6b';
          ctx2.fillRect(x + 3 + i * 4, fy + 4, 2, 1);
        }
      }
    });
  }

  drawForeground(ctx, cam) {
    const t = this.time;

    // колышущаяся трава переднего плана
    const off = (cam.x * 1.2) % 312;
    for (const gr of this.grass) {
      let x = gr.x - off;
      if (x < 0) x += 312;
      for (let rep = -1; rep <= 1; rep++) {
        const sx = Math.round(x + rep * 312);
        if (sx < -10 || sx > CONFIG.WIDTH + 10) continue;
        const sway = Math.round(Math.sin(t * 2.2 + gr.x) * 2);
        ctx.fillStyle = '#8a6a2e';
        ctx.fillRect(sx + sway, CONFIG.GROUND_Y - gr.h, 1, gr.h);
        ctx.fillRect(sx + 3 + sway, CONFIG.GROUND_Y - gr.h + 2, 1, gr.h - 2);
        ctx.fillStyle = '#a8843a';
        ctx.fillRect(sx + 6 - sway, CONFIG.GROUND_Y - gr.h + 1, 1, gr.h - 1);
      }
    }

    // светлячки сумерек
    for (let i = 0; i < 5; i++) {
      const x = ((i * 77 + t * 9 * (i % 2 ? -1 : 1)) % (CONFIG.WIDTH + 40)) - 20;
      const y = 70 + Math.sin(t * 1.8 + i * 2.4) * 22 + i * 11;
      if (Math.floor(t * 5 + i) % 3 !== 0) {
        ctx.fillStyle = '#ffe98a';
        ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
      }
    }
  }

  getPattern(d) {
    const rng = this.rng;
    const P = (weight, value) => ({ weight, value });
    // Деревня: верёвки-ловушки, ямы, воины с копьями и ягуары (у каждого локация свой набор)
    const table = [
      P(3, { length: 110, spawns: [], items: Biome.idolArc(40, 4, 30) }),
      P(3, { length: 145, spawns: [{ type: 'rope', at: 60 }], items: Biome.idolArc(50, 5, 48) }),
      P(3, {
        length: 150,
        spawns: [{ type: 'rope', at: 70 }],
        items: [{ type: 'idol', at: 60, alt: 0 }, { type: 'idol', at: 72, alt: 0 }, { type: 'idol', at: 84, alt: 0 }],
      }),
      P(3, (dd) => ({
        length: 155,
        spawns: [{ type: 'pit', at: 50, w: dd > 0.5 ? 42 : 34 }],
        items: Biome.idolArc(44, 4, 46),
      })),
      P(d > 0.2 ? 2.5 : 0, { length: 190, spawns: [{ type: 'warrior', at: 120 }], items: [] }),
      P(d > 0.3 ? 2 : 0, {
        length: 195, spawns: [{ type: 'warrior', at: 90 }, { type: 'rope', at: 155 }], items: [],
      }),
      P(d > 0.2 ? 2 : 0, {
        length: 205,
        spawns: [{ type: 'rope', at: 55 }, { type: 'rope', at: 84 }],   // длинное скольжение
        items: [{ type: 'idol', at: 52, alt: 0 }, { type: 'idol', at: 70, alt: 0 }, { type: 'idol', at: 88, alt: 0 }],
      }),
      P(d > 0.35 ? 2 : 0, (dd) => ({
        length: 200,
        spawns: dd > 0.65
          ? [{ type: 'bat', at: 100, alt: 19 }, { type: 'bat', at: 134, alt: 19 }]
          : [{ type: 'bat', at: 100, alt: 19 }],
        items: [],
      })),
      P(d > 0.45 ? 2 : 0, { length: 200, spawns: [{ type: 'jaguar', at: 150 }], items: [] }),
      P(d > 0.4 ? 1.5 : 0, {
        length: 195, spawns: [{ type: 'pit', at: 46, w: 34 }, { type: 'warrior', at: 140 }], items: [],
      }),
      P(0.6, { length: 130, spawns: [], items: [{ type: 'heart', at: 60, alt: 32 }] }),
    ];
    const picked = Biome.weightedPick(rng, table);
    return typeof picked === 'function' ? picked(d) : picked;
  }
}
