  <script>
/* ==== js/world/Temple.js ==== */
/**
 * Temple — заброшенный храм майя: ночное небо со звёздами, дальние и
 * ближние пирамиды со ступенями, стена с резными масками, обломки колонн,
 * светящиеся факелы, висящие лианы, пылинки. Самая злая локация:
 * статуи, длинные ямы, каменные балки под проскальзывание, воины.
 */
class Temple extends Biome {
  constructor(seed) {
    super(seed);
    const rng = this.rng;

    this.stars = [];
    for (let i = 0; i < 40; i++) {
      this.stars.push({ x: rng() * CONFIG.WIDTH, y: rng() * (CONFIG.GROUND_Y - 50), tw: rng() * 6 });
    }

    this.farPyramids = [];
    for (let i = 0; i < 6; i++) {
      this.farPyramids.push({ x: i * 64 + rng() * 24, w: 40 + rng() * 26, h: 26 + rng() * 22 });
    }

    this.pyramids = [];
    for (let i = 0; i < 5; i++) {
      this.pyramids.push({
        x: i * 78 + rng() * 26,
        w: 46 + rng() * 26,
        h: 34 + rng() * 26,
        door: rng() > 0.4,
      });
    }

    this.masks = [];
    for (let i = 0; i < 5; i++) {
      this.masks.push({ x: i * 68 + rng() * 24, hue: rng() > 0.5 ? '#c9a83e' : '#7fae5a', glow: rng() > 0.5 });
    }

    this.columns = [];
    for (let i = 0; i < 6; i++) {
      this.columns.push({ x: i * 58 + rng() * 20, h: 26 + rng() * 22, broken: rng() > 0.35 });
    }

    this.torches = [];
    for (let i = 0; i < 6; i++) this.torches.push({ x: i * 56 + rng() * 20 });

    this.vines = [];
    for (let i = 0; i < 9; i++) this.vines.push({ x: i * 44 + rng() * 16, len: 16 + rng() * 26 });

    this.rubles = [];
    for (let i = 0; i < 10; i++) this.rubles.push({ x: i * 36 + rng() * 14, w: 5 + rng() * 11 });

    // руны на стене (слабо мерцают)
    this.runes = [];
    for (let i = 0; i < 6; i++) {
      this.runes.push({ x: i * 57 + rng() * 30, kind: Math.floor(rng() * 3) });
    }

    // черепа и камни у самой земли
    this.skulls = [];
    for (let i = 0; i < 4; i++) {
      this.skulls.push({ x: i * 93 + rng() * 34, flip: rng() > 0.5 });
    }
  }

  get name() { return 'ХРАМ'; }
  get track() { return 'temple'; }
  get skyTop() { return '#151129'; }
  get skyBottom() { return '#4a3160'; }
  get groundTop() { return '#6a6f78'; }
  get groundDirt() { return '#4a4e56'; }
  get groundShade() { return '#3a3d44'; }
  get groundLine() { return '#8a9099'; }

  drawBackground(ctx, cam) {
    const W = CONFIG.WIDTH, GY = CONFIG.GROUND_Y;
    const t = this.time;

    // --- ночное небо ---
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, this.skyTop);
    g.addColorStop(0.7, '#33254c');
    g.addColorStop(1, this.skyBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GY);

    // --- мерцающие звезды ---
    const starOff = (cam.x * 0.03) % W;
    for (const s of this.stars) {
      const sx = ((s.x - starOff) % W + W) % W;
      const alpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.7 + s.tw));
      ctx.fillStyle = 'rgba(235,235,215,' + alpha.toFixed(2) + ')';
      ctx.fillRect(Math.round(sx), Math.round(s.y), 1, 1);
      if (alpha > 0.9) {
        ctx.fillRect(Math.round(sx) - 1, Math.round(s.y), 3, 1);
        ctx.fillRect(Math.round(sx), Math.round(s.y) - 1, 1, 3);
      }
    }

    // --- луна с ореолом и кратерами ---
    const moonX = 70 - ((cam.x * 0.03) % 800);
    ctx.fillStyle = 'rgba(232,224,200,0.14)';
    ctx.fillRect(moonX - 16, 12, 32, 32);
    ctx.fillStyle = 'rgba(232,224,200,0.3)';
    ctx.fillRect(moonX - 13, 15, 26, 26);
    ctx.fillStyle = '#e8e0c8';
    ctx.fillRect(moonX - 10, 18, 20, 20);
    ctx.fillStyle = '#d5cdaf';
    ctx.fillRect(moonX + 4, 20, 6, 6);
    ctx.fillStyle = '#c8c0a8';
    ctx.fillRect(moonX - 6, 24, 4, 4);
    ctx.fillRect(moonX + 1, 30, 3, 3);
    ctx.fillRect(moonX - 8, 32, 2, 2);

    // --- дальние силуэты пирамид со ступенями ---
    Biome.parallax(ctx, cam, 0.14, 390, this.farPyramids, (ctx2, x, p) => {
      const base = GY + 3; // пирамиды стоят на земле
      for (let k = 0; k < p.h; k++) {
        const w = Math.round(p.w * (1 - 0.75 * (k / p.h)));
        ctx2.fillStyle = k > p.h * 0.55 ? '#211c38' : '#282243';
        ctx2.fillRect(x + Math.round((p.w - w) / 2), base - k, w, 1);
      }
      // лестница по центру
      ctx2.fillStyle = '#1a1630';
      for (let k = 0; k < p.h; k += 4) {
        const w = Math.round(p.w * (1 - 0.75 * (k / p.h)));
        ctx2.fillRect(x + Math.round(p.w / 2) - 2, base - k, 4, 1);
      }
    });

    // --- ближние проработанные пирамиды ---
    Biome.parallax(ctx, cam, 0.3, 430, this.pyramids, (ctx2, x, p) => {
      const base = GY + 2; // пирамиды стоят на земле
      // ступени
      for (let k = 0; k < p.h; k++) {
        const w = Math.round(p.w * (1 - 0.7 * (k / p.h)));
        ctx2.fillStyle = k % 4 === 0 ? '#3f3860' : (k > p.h * 0.5 ? '#383156' : '#443c68');
        ctx2.fillRect(x + Math.round((p.w - w) / 2), base - k, w, 1);
      }
      // центральная лестница (светлые ступени)
      for (let k = 0; k < p.h; k += 3) {
        const w = Math.round(p.w * (1 - 0.7 * (k / p.h)));
        ctx2.fillStyle = '#54497a';
        ctx2.fillRect(x + Math.round(p.w / 2) - 3, base - k, 6, 1);
      }
      // храм на вершине
      ctx2.fillStyle = '#4a4170';
      ctx2.fillRect(x + p.w / 2 - 7, base - p.h - 9, 14, 10);
      ctx2.fillStyle = '#332c50';
      ctx2.fillRect(x + p.w / 2 - 9, base - p.h - 11, 18, 3);
      ctx2.fillStyle = '#2a2444';
      ctx2.fillRect(x + p.w / 2 - 5, base - p.h - 9, 10, 2);
      // светящийся дверной проём
      if (p.door) {
        const pulse = 0.55 + 0.45 * Math.sin(t * 2.4 + x * 0.1);
        ctx2.fillStyle = 'rgba(224,165,58,' + (0.3 + pulse * 0.3).toFixed(2) + ')';
        ctx2.fillRect(x + p.w / 2 - 5, base - p.h - 6, 10, 7);
        ctx2.fillStyle = '#e0a53a';
        ctx2.fillRect(x + p.w / 2 - 3, base - p.h - 4, 6, 5);
        ctx2.fillStyle = '#ffe9a8';
        ctx2.fillRect(x + p.w / 2 - 2, base - p.h - 3, 4, 3);
      }
      // головы змей по углам основания
      ctx2.fillStyle = '#54497a';
      ctx2.fillRect(x - 4, base - 5, 6, 5);
      ctx2.fillRect(x + p.w - 2, base - 5, 6, 5);
      ctx2.fillStyle = '#c9a83e';
      ctx2.fillRect(x - 3, base - 4, 2, 2);
      ctx2.fillRect(x + p.w, base - 4, 2, 2);
    });

    // --- каменная стена с резными масками ---
    const wallY = GY - 24;
    ctx.fillStyle = '#272238';
    ctx.fillRect(0, wallY, W, 4);
    ctx.fillStyle = '#2f2946';
    ctx.fillRect(0, wallY + 4, W, GY - wallY - 4);
    // каменные блоки
    const wallOff = (cam.x * 0.55) % 28;
    ctx.fillStyle = '#373054';
    for (let x = -wallOff; x < W; x += 28) {
      ctx.fillRect(Math.round(x), wallY + 5, 12, 2);
      ctx.fillRect(Math.round(x) + 6, wallY + 9, 12, 2);
      ctx.fillRect(Math.round(x), wallY + 13, 12, 2);
    }
    ctx.fillStyle = '#221d34';
    ctx.fillRect(0, wallY + 7, W, 1);
    ctx.fillRect(0, wallY + 11, W, 1);
    // барельефы-маски, у которых светятся глаза
    Biome.parallax(ctx, cam, 0.55, 340, this.masks, (ctx2, x, m) => {
      const my = wallY + 4;
      ctx2.fillStyle = '#4a4170';
      ctx2.fillRect(x, my, 14, 14);
      ctx2.fillStyle = '#3a3358';
      ctx2.fillRect(x + 2, my + 2, 10, 10);
      // глаза-уголки и рот-зубы
      ctx2.fillStyle = m.hue;
      ctx2.fillRect(x + 3, my + 4, 3, 3);
      ctx2.fillRect(x + 8, my + 4, 3, 3);
      ctx2.fillStyle = '#2a2444';
      ctx2.fillRect(x + 4, my + 5, 1, 1);
      ctx2.fillRect(x + 9, my + 5, 1, 1);
      ctx2.fillStyle = m.hue;
      ctx2.fillRect(x + 4, my + 9, 6, 1);
      ctx2.fillStyle = '#e8edf5';
      ctx2.fillRect(x + 5, my + 9, 1, 2);
      ctx2.fillRect(x + 8, my + 9, 1, 2);
      // свечение глаз
      if (m.glow) {
        const pulse = Math.sin(t * 3 + x * 0.2) > 0.2;
        if (pulse) {
          ctx2.fillStyle = 'rgba(255,210,122,0.5)';
          ctx2.fillRect(x + 2, my + 3, 5, 5);
          ctx2.fillRect(x + 7, my + 3, 5, 5);
        }
      }
    });

    // --- руны на камне стены (слабо мерцают) ---
    Biome.parallax(ctx, cam, 0.55, 340, this.runes, (ctx2, x, r) => {
      const my = wallY + 6;
      const glow = 0.22 + 0.18 * Math.sin(t * 1.6 + r.x * 0.3);
      ctx2.fillStyle = 'rgba(224,165,58,' + glow.toFixed(2) + ')';
      if (r.kind === 0) {
        ctx2.fillRect(x, my, 1, 8);
        ctx2.fillRect(x - 2, my, 5, 1);
        ctx2.fillRect(x - 2, my + 7, 5, 1);
      } else if (r.kind === 1) {
        ctx2.fillRect(x, my, 4, 1);
        ctx2.fillRect(x + 1, my + 2, 2, 1);
        ctx2.fillRect(x, my + 4, 4, 1);
        ctx2.fillRect(x + 1, my + 6, 2, 1);
      } else {
        ctx2.fillRect(x, my, 1, 8);
        ctx2.fillRect(x + 3, my, 1, 8);
        ctx2.fillRect(x, my + 3, 4, 1);
      }
    });

    // --- обломки колонн ---
    Biome.parallax(ctx, cam, 0.68, 370, this.columns, (ctx2, x, c) => {
      const base = GY + 2; // колонны стоят на земле
      ctx2.fillStyle = '#4a4e56';
      ctx2.fillRect(x, base - c.h, 8, c.h);
      ctx2.fillStyle = '#5a5f69';
      ctx2.fillRect(x, base - c.h, 3, c.h);
      // каннелюры
      ctx2.fillStyle = '#3a3d44';
      for (let i = 0; i < 4; i++) ctx2.fillRect(x + 5, base - c.h + 4 + i * 7, 1, 4);
      // обломанный верх / капитель
      if (c.broken) {
        ctx2.fillStyle = '#3a3d44';
        ctx2.fillRect(x + 2, base - c.h - 3, 4, 3);
        ctx2.fillStyle = '#5a5f69';
        ctx2.fillRect(x + 4, base - c.h - 4, 3, 2);
      } else {
        ctx2.fillStyle = '#5a5f69';
        ctx2.fillRect(x - 2, base - c.h - 4, 12, 4);
        ctx2.fillStyle = '#6a6f78';
        ctx2.fillRect(x - 2, base - c.h - 4, 12, 1);
      }
      // мх снизу
      ctx2.fillStyle = '#3e7a3a';
      ctx2.fillRect(x, base - 2, 3, 2);
    });

    // --- факелы с анимированным пламенем и световым пятном ---
    Biome.parallax(ctx, cam, 0.8, 460, this.torches, (ctx2, x, f) => {
      const base = GY - 22;
      // свет на стене
      const pulse = 0.16 + 0.06 * Math.sin(t * 8 + f.x);
      ctx2.fillStyle = 'rgba(255,170,80,' + pulse.toFixed(2) + ')';
      ctx2.fillRect(x - 7, base - 14, 20, 20);
      // держатель
      ctx2.fillStyle = '#5c4a30';
      ctx2.fillRect(x + 1, base, 3, 12);
      ctx2.fillStyle = '#6a563a';
      ctx2.fillRect(x, base, 5, 2);
      ctx2.fillStyle = '#3d3122';
      ctx2.fillRect(x + 1, base + 10, 3, 2);
      // пламя из трёх языков
      const fl = Math.floor(t * 10 + f.x) % 3;
      ctx2.fillStyle = '#c94f1e';
      ctx2.fillRect(x, base - 7 - fl, 5, 8 + fl);
      ctx2.fillStyle = '#e07a2e';
      ctx2.fillRect(x + 1, base - 5 - fl, 3, 6);
      ctx2.fillStyle = '#ffd27a';
      ctx2.fillRect(x + 1, base - 4, 3, 3);
      ctx2.fillStyle = '#fff3c8';
      ctx2.fillRect(x + 2, base - 3, 1, 2);
    });

    // --- висящие лианы (с покачиванием) ---
    Biome.parallax(ctx, cam, 0.9, 340, this.vines, (ctx2, x, v) => {
      const sway = Math.round(Math.sin(t * 1.3 + x * 0.2) * 3);
      ctx2.fillStyle = '#26502e';
      ctx2.fillRect(x + sway, 0, 2, v.len);
      ctx2.fillStyle = '#357040';
      ctx2.fillRect(x + 6 - sway, 0, 2, v.len - 6);
      ctx2.fillStyle = '#2b6b31';
      ctx2.fillRect(x - 2 + sway, v.len - 4, 5, 4);
      ctx2.fillRect(x + 5 - sway, v.len - 9, 4, 3);
      // узлы на лианах
      ctx2.fillStyle = '#1f4f26';
      ctx2.fillRect(x + sway, Math.round(v.len * 0.5), 2, 2);
    });

    // --- черепа и камни у земли ---
    Biome.parallax(ctx, cam, 0.9, 330, this.skulls, (ctx2, x, s) => {
      const base = GY + 2;
      ctx2.fillStyle = '#c8c0a8';
      ctx2.fillRect(x, base - 6, 6, 5);
      ctx2.fillStyle = '#a8a08a';
      ctx2.fillRect(x, base - 2, 6, 1);
      ctx2.fillStyle = '#2a2444';
      ctx2.fillRect(x + 1, base - 5, 1, 2);
      ctx2.fillRect(x + 4, base - 5, 1, 2);
      ctx2.fillStyle = '#4a4e56';
      ctx2.fillRect(x + (s.flip ? -5 : 7), base - 2, 3, 2);
    });
  }

  drawForeground(ctx, cam) {
    const t = this.time;

    // пылинки, мерно плывущие в свете
    ctx.fillStyle = 'rgba(226,216,180,0.5)';
    for (let i = 0; i < 10; i++) {
      const x = ((i * 53 + t * 6 * (i % 2 ? 1 : -1)) % (CONFIG.WIDTH + 30)) - 15;
      const y = 24 + Math.sin(t * 1.1 + i * 1.9) * 18 + i * 12;
      ctx.fillRect(Math.round(x), Math.round(y) % CONFIG.GROUND_Y, 1, 1);
    }

    // угольки, поднимающиеся от факелов
    for (let i = 0; i < 8; i++) {
      const rise = (t * 22 + i * 30) % (CONFIG.GROUND_Y + 10);
      const x = (((i * 67 + Math.sin(t * 2 + i) * 14 - t * 6) % (CONFIG.WIDTH + 40)) + CONFIG.WIDTH + 40) % (CONFIG.WIDTH + 40) - 20;
      const alpha = Math.max(0, 0.8 - rise / (CONFIG.GROUND_Y * 0.8));
      ctx.fillStyle = 'rgba(255,170,80,' + alpha.toFixed(2) + ')';
      ctx.fillRect(Math.round(x), Math.round(CONFIG.GROUND_Y - rise), 1, 1);
    }

    // падающие листья
    for (let i = 0; i < 3; i++) {
      const fall = (t * 14 + i * 55) % (CONFIG.GROUND_Y + 20);
      const x = 40 + i * 90 + Math.sin(t * 2 + i * 2.5) * 12;
      ctx.fillStyle = '#3e7a3a';
      ctx.fillRect(Math.round(x), Math.round(fall), 3, 2);
      ctx.fillStyle = '#2b5f2c';
      ctx.fillRect(Math.round(x) + 1, Math.round(fall) + 2, 2, 1);
    }

    // каменная крошка на земле переднего плана
    const off = (cam.x * 1.15) % 90;
    ctx.fillStyle = '#241f36';
    for (let i = 0; i < 6; i++) {
      const x = Math.round((((i * 17 - off) % 90) + 90) % 90) + i * 50 - 30;
      if (x > -10 && x < CONFIG.WIDTH) ctx.fillRect(x, CONFIG.GROUND_Y + 2 + (i % 3) * 3, 4 + (i % 4) * 2, 3);
    }

    // тёмные пилястры по краям кадра (виньетка храма)
    ctx.fillStyle = 'rgba(20,16,36,0.85)';
    ctx.fillRect(0, 0, 6, CONFIG.HEIGHT);
    ctx.fillRect(CONFIG.WIDTH - 6, 0, 6, CONFIG.HEIGHT);
    ctx.fillStyle = 'rgba(20,16,36,0.35)';
    ctx.fillRect(6, 0, 4, CONFIG.HEIGHT);
    ctx.fillRect(CONFIG.WIDTH - 10, 0, 4, CONFIG.HEIGHT);
  }

  getPattern(d) {
    const rng = this.rng;
    const P = (weight, value) => ({ weight, value });
    // Храм: шипы, статуи, балки, ямы, воины и мыши (свой набор — своя музыка, свои мобы)
    const table = [
      P(2.5, { length: 110, spawns: [], items: Biome.idolArc(40, 5, 30) }),
      P(3, { length: 145, spawns: [{ type: 'spikes', at: 60 }], items: Biome.idolArc(50, 5, 48) }),
      P(3, (dd) => ({
        length: 160,
        spawns: [{ type: 'pit', at: 50, w: dd > 0.4 ? 44 : 38 }],
        items: Biome.idolArc(44, 4, 48),
      })),
      P(3, {
        length: 150,
        spawns: [{ type: 'beam', at: 70 }],
        items: [{ type: 'idol', at: 60, alt: 0 }, { type: 'idol', at: 72, alt: 0 }, { type: 'idol', at: 84, alt: 0 }],
      }),
      P(d > 0.25 ? 2.5 : 0, { length: 200, spawns: [{ type: 'statue', at: 110 }], items: [] }),
      P(d > 0.2 ? 2.5 : 0, { length: 190, spawns: [{ type: 'warrior', at: 120 }], items: [] }),
      P(d > 0.3 ? 2 : 0, {
        length: 210, spawns: [{ type: 'statue', at: 70 }, { type: 'spikes', at: 150 }], items: [],
      }),
      P(d > 0.2 ? 2 : 0, {
        length: 215,
        spawns: [{ type: 'beam', at: 58 }, { type: 'beam', at: 87 }],   // длинное скольжение
        items: [{ type: 'idol', at: 54, alt: 0 }, { type: 'idol', at: 72, alt: 0 }, { type: 'idol', at: 91, alt: 0 }],
      }),
      P(d > 0.35 ? 2 : 0, (dd) => ({
        length: 175,
        spawns: dd > 0.6
          ? [{ type: 'bat', at: 100, alt: 19 }, { type: 'bat', at: 134, alt: 19 }]
          : [{ type: 'bat', at: 100, alt: 19 }],
        items: [],
      })),
      P(d > 0.4 ? 2 : 0, {
        length: 205, spawns: [{ type: 'spikes', at: 60 }, { type: 'warrior', at: 152 }], items: [],
      }),
      P(d > 0.45 ? 1.5 : 0, {
        length: 200, spawns: [{ type: 'pit', at: 46, w: 38 }, { type: 'statue', at: 140 }], items: [],
      }),
      P(d > 0.5 ? 1.5 : 0, {
        length: 210, spawns: [{ type: 'warrior', at: 80 }, { type: 'warrior', at: 170 }], items: [],
      }),
      P(d > 0.55 ? 1.5 : 0, {
        length: 210, spawns: [{ type: 'beam', at: 55 }, { type: 'spikes', at: 130 }], items: [],
      }),
      P(d > 0.3 ? 2 : 0, {
        length: 165, spawns: [{ type: 'log2', at: 70 }], items: Biome.idolArc(46, 4, 44),
      }),
      P(0.5, { length: 130, spawns: [], items: [{ type: 'heart', at: 60, alt: 32 }] }),
    ];
    const picked = Biome.weightedPick(rng, table);
    return typeof picked === 'function' ? picked(d) : picked;
  }
}

  <script>
/* ==== js/world/Factories.js ==== */
/**
 * Фабрики (Factory Method) — централизованное создание сущностей.
 *
 * Генератор уровня описывает трассу данными («spawn: {type:'snake'}»),
 * а конкретный класс выбирается здесь. Чтобы добавить нового врага,
 * достаточно нового файла-класса и одной строки в switch —
 * открытость-закрытость (Open/Closed).
 */
class EnemyFactory {
  /** @returns {Enemy|null} */
  static create(type, x, opts = {}) {
    switch (type) {
      case 'snake': return new Snake(x);
      case 'jaguar': return new Jaguar(x);
      case 'bat': return new Bat(x, opts.alt || 19);
      case 'warrior': return new Warrior(x);
      case 'spear': return new Spear(x, opts.y || CONFIG.GROUND_Y - 12);
      default: return null;
    }
  }
}

class ObstacleFactory {
  /** @returns {Obstacle|null} */
  static create(type, x, opts = {}) {
    switch (type) {
      case 'spikes': return new Spikes(x, opts.w || 16);
      case 'log': return new LowLog(x);            // деревянное бревно (джунгли)
      case 'log2': return new LowLog(x, 'log2');   // каменный каток (храм)
      case 'vine': return new Vine(x);
      case 'rope': return new RopeTrap(x);
      case 'beam': return new StoneBeam(x);
      case 'statue': return new Statue(x);
      case 'pit': return new Pit(x, opts.w || 40);
      default: return null;
    }
  }
}

class ItemFactory {
  /** @returns {Item|null} */
  static create(type, x, y) {
    switch (type) {
      case 'idol': return new Idol(x, y);
      case 'heart': return new Heart(x, y);
      default: return null;
    }
  }
}

  <script>
/* ==== js/world/World.js ==== */
/**
 * World — игровой мир: камера, земля, генератор трассы, столкновения.
 *
 * Это «композиция»: World владеет игроком, биомом, списками сущностей
 * и частицами. Генерация уровня — данные-driven: биом отдаёт «паттерны»,
 * а фабрики создают конкретные объекты.
 */
class World {
  /** Длительность плавного перехода между локациями, с. */
  static FADE_TIME = 1.8;

  #obstacles = [];
  #enemies = [];
  #items = [];
  #projectiles = [];
  #particles = [];
  #pits = [];
  #biomeClasses = [Jungle, Village, Temple];
  #biomeIndex = 0;
  #loop = 0;
  #spawnCursor = 0;
  #nextBiomeAt = CONFIG.TRANSITION_EVERY; // в метрах
  #rng = makeRandom(1337);
  #shake = 0;
  #startX = 60;
  #biomeStartDist = 0;
  #prevBiome = null;   // предыдущая локация (для плавного кроссфейда)
  #transT = 1;         // таймер перехода (1 = переход завершён)
  #heartsThisBiome = 0; // сколько сердечек уже упало на этой локации

  constructor(input) {
    this.input = input;
    this.player = new Player(60, CONFIG.GROUND_Y - Player.STAND_H);
    this.player.world = this;
    this.camera = { x: 0, y: 0 };
    this.time = 0;
    this.score = 0;
    this.biome = new this.#biomeClasses[0](1337);
    this.reset();

    // Очки за предметы (World не знает про HUD — только события).
    events.on('idol:collected', () => { this.score += CONFIG.IDOL_SCORE; });
    events.on('enemy:stomped', () => { this.score += CONFIG.STOMP_SCORE; });
    events.on('player:fall', () => { this.#shake = 0.35; });
    events.on('player:hurt', () => { this.#shake = 0.3; });
    // При смерти героя все объекты мира просто исчезают (без «улетания»).
    events.on('player:dead', () => this.clearEntities());
  }

  /** Полный сброс мира (новая игра). */
  reset() {
    this.#obstacles.length = 0;
    this.#enemies.length = 0;
    this.#items.length = 0;
    this.#projectiles.length = 0;
    this.#particles.length = 0;
    this.#pits.length = 0;
    this.#biomeIndex = 0;
    this.#loop = 0;
    this.#nextBiomeAt = CONFIG.TRANSITION_EVERY;
    this.#biomeStartDist = 0;
    this.#prevBiome = null;
    this.#transT = 1;
    this.#heartsThisBiome = 0;
    this.biome = new this.#biomeClasses[0](1337 + Math.floor(Math.random() * 1000));
    this.player.reset(60, CONFIG.GROUND_Y - Player.STAND_H);
    this.#startX = this.player.x;
    this.camera.x = this.player.x - 60;
    this.camera.y = 0;
    this.time = 0;
    this.score = 0;
    this.#spawnCursor = this.player.x + CONFIG.WIDTH + 60;
    this.biome.track && AudioManager.instance.playSong(this.biome.track);
  }

  // ------------------------------------------------------------------
  // Геттеры состояния
  // ------------------------------------------------------------------

  /**
   * Прогресс внутри текущей локации 0..1: скорость и сложность растут
   * к её концу, а на новой локации всё начинается заново.
   */
  get biomeProgress() {
    return clamp(
      (this.distance - this.#biomeStartDist) / CONFIG.TRANSITION_EVERY,
      0, 1,
    );
  }

  /** Текущая скорость бега, px/с (постепенный разгон внутри биома). */
  get speed() {
    const p = this.biomeProgress;
    const accel = Math.pow(p, CONFIG.RUN_EASE) * (CONFIG.RUN_MAX - CONFIG.RUN_START);
    return Math.min(CONFIG.RUN_MAX, CONFIG.RUN_START + this.#loop * 9 + accel);
  }

  /** Пройденное расстояние в метрах. */
  get distance() { return Math.max(0, Math.floor((this.player.x - this.#startX) / 16)); }

  /** Сложность 0..1 — растёт с прогрессом локации и «петлями». */
  get difficulty() {
    return clamp(0.08 + this.#loop * 0.22 + this.biomeProgress * 0.85, 0, 1);
  }

  // ------------------------------------------------------------------
  // Земля
  // ------------------------------------------------------------------

  /** Есть ли земля под точкой (нет — если там яма). */
  isGroundAt(x) {
    for (const pit of this.#pits) {
      if (!pit.isDead && x > pit.x && x < pit.x + pit.w) return false;
    }
    return true;
  }

  /** Есть ли над игроком низкое препятствие (чтобы не вставать под бревном). */
  hasOverhead(player) {
    const standBox = {
      x: player.x,
      y: CONFIG.GROUND_Y - Player.STAND_H,
      w: Player.STAND_W,
      h: Player.STAND_H,
    };
    for (const o of this.#obstacles) {
      if (o.isOverhead && !o.isDead && rectsOverlap(standBox, o.hitbox)) return true;
    }
    return false;
  }

  /** Безопасная точка для возрождения после падения. */
  findSafeGround(x) {
    let px = x + 8;
    let guard = 0;
    let moved = true;
    while (moved && guard++ < 20) {
      moved = false;
      for (const pit of this.#pits) {
        if (!pit.isDead && px > pit.x - 10 && px < pit.x + pit.w + 10) {
          px = pit.x + pit.w + 16;
          moved = true;
        }
      }
    }
    return px;
  }

  // ------------------------------------------------------------------
  // Спавн
  // ------------------------------------------------------------------

  addObstacle(o) { o.world = this; this.#obstacles.push(o); if (o.isPit) this.#pits.push(o); }
  addEnemy(e) { e.world = this; this.#enemies.push(e); }
  addItem(i) { i.world = this; this.#items.push(i); }
  addProjectile(p) { p.world = this; this.#projectiles.push(p); }

  /** Снаряд (копьё воина и т.п.). */
  spawnProjectile(p) { this.addProjectile(p); }

  /** Все активные сущности (для отладки, тестов и будущих плагинов). */
  get entities() {
    return [...this.#obstacles, ...this.#enemies, ...this.#items, ...this.#projectiles];
  }

  /** При смерти игрока всё живое в мире просто исчезает — без «улетания» вверх. */
  clearEntities() {
    this.#obstacles.length = 0;
    this.#enemies.length = 0;
    this.#items.length = 0;
    this.#projectiles.length = 0;
    this.#pits.length = 0;
    this.#particles.length = 0;
  }

  /** Создать сущности из «паттерна» биома. */
  #spawnPattern(pattern, x0) {
    for (const s of pattern.spawns || []) {
      if (s.type === 'pit') {
        this.addObstacle(ObstacleFactory.create('pit', x0 + s.at, s));
      } else {
        const obstacle = ObstacleFactory.create(s.type, x0 + s.at, s);
        if (obstacle) this.addObstacle(obstacle);
        else {
          const enemy = EnemyFactory.create(s.type, x0 + s.at, s);
          // наземные враги не спавнятся над ямой (летающие — можно)
          if (enemy && (enemy.flies || this.isGroundAt(enemy.x + enemy.w / 2))) this.addEnemy(enemy);
        }
      }
    }
    for (const it of pattern.items || []) {
      const y = CONFIG.GROUND_Y - (it.alt || 30) - 8;
      const item = ItemFactory.create(it.type, x0 + it.at, y);
      if (item) this.addItem(item);
    }
    this.#fixItemPlacement();
  }

  /**
   * Монетки и сердечки не должны оказаться ВНУТРИ препятствий:
   * если предмет пересекается с препятствием — поднимаем его над ним.
   */
  #fixItemPlacement() {
    for (const it of this.#items) {
      if (it.isDead) continue;
      let box = { x: it.x, y: it.baseY, w: it.w, h: it.h };
      for (const o of this.#obstacles) {
        if (o.isDead) continue;
        if (o.isPit) {
          // над ямой монетка должна быть хотя бы на уровне земли
          const overPit = box.x + box.w > o.x + 4 && box.x < o.x + o.w - 4;
          if (overPit && box.y + box.h > CONFIG.GROUND_Y - 10) {
            it.setBaseY(CONFIG.GROUND_Y - it.h - 14);
            box = { x: it.x, y: it.baseY, w: it.w, h: it.h };
          }
          continue;
        }
        let guard = 0;
        while (guard++ < 8 && rectsOverlap(box, { x: o.x, y: o.y, w: o.w, h: o.h })) {
          it.setBaseY(it.baseY - 6);
          box = { x: it.x, y: it.baseY, w: it.w, h: it.h };
        }
      }
    }
  }

  /** Генерировать трассу впереди игрока. */
  #generate() {
    const ahead = this.player.x + CONFIG.WIDTH + 120;
    while (this.#spawnCursor < ahead) {
      const pattern = this.#withHeartGuarantee(this.biome.getPattern(this.difficulty));
      this.#spawnPattern(pattern, this.#spawnCursor);
      if ((pattern.items || []).some((i) => i.type === 'heart')) this.#heartsThisBiome++;
      this.#spawnCursor += pattern.length + Math.floor(this.#rng() * 36);
    }
  }

  /**
   * Гарантия сердечек на каждой локации: как минимум одно (к ~30% пути),
   * второе — с шансом на вторую половине. Недостающее подставляем сами.
   */
  #withHeartGuarantee(pattern) {
    const p = this.biomeProgress;
    if (this.#heartsThisBiome === 0 && p > 0.3) return this.#heartPattern();
    if (this.#heartsThisBiome === 1 && p > 0.7 && this.#rng() < 0.5) return this.#heartPattern();
    return pattern;
  }

  /** Паттерн с одним сердечком на уровне пояса (под прыжок-подбор). */
  #heartPattern() {
    return { length: 140, spawns: [], items: [{ type: 'heart', at: 60, alt: 34 }] };
  }

  /** Смена локации. */
  #nextBiome() {
    const prevLoop = this.#loop;
    this.#biomeIndex = (this.#biomeIndex + 1) % this.#biomeClasses.length;
    if (this.#biomeIndex === 0) this.#loop++;

    // предыдущая локация остаётся на время плавного кроссфейда
    this.#prevBiome = this.biome;
    this.#transT = 0;

    this.biome = new this.#biomeClasses[this.#biomeIndex](1337 + this.#loop * 31 + this.#biomeIndex * 7);
    this.#biomeStartDist = this.distance; // скорость и сложность стартуют заново
    this.#heartsThisBiome = 0;
    // убираем «предыдущую» локацию впереди игрока
    this.#obstacles = this.#obstacles.filter((o) => o.x < this.player.x);
    this.#enemies = this.#enemies.filter((e) => e.x < this.player.x);
    this.#items = this.#items.filter((i) => i.x < this.player.x);
    // ямы впереди тоже принадлежали старой локации — иначе игрок
    // проваливается под невидимую дыру (фикс бага перехода)
    this.#pits = this.#pits.filter((p) => !p.isDead && p.x < this.player.x);
    this.#projectiles.length = 0;
    events.emit('biome:changed', { biome: this.biome, loop: this.#loop });
    // все три локации пройдены — победа!
    if (prevLoop === 0 && this.#loop === 1) {
      events.emit('victory', { score: this.score, distance: this.distance });
    }
  }

  // ------------------------------------------------------------------
  // Частицы
  // ------------------------------------------------------------------

  /** Пыль, искры, кровь врагов. */
  spawnParticles(x, y, color, count = 4, vy0 = -60) {
    if (this.#particles.length > 220) return;
    for (let i = 0; i < count; i++) {
      this.#particles.push({
        x, y,
        vx: -this.speed * 0.3 + (Math.random() * 60 - 30),
        vy: vy0 + Math.random() * 40 - 20,
        life: 0.35 + Math.random() * 0.3,
        color,
        size: 1 + Math.floor(Math.random() * 2),
      });
    }
  }

  #updateParticles(dt) {
    const ps = this.#particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) ps.splice(i, 1);
    }
  }

  // ------------------------------------------------------------------
  // Обновление
  // ------------------------------------------------------------------

  update(dt, input) {
    this.time += dt;
    this.biome.tick(dt);
    if (this.#prevBiome) {
      this.#prevBiome.tick(dt);
      this.#transT += dt;
      if (this.#transT >= World.FADE_TIME) this.#prevBiome = null;
    }
    this.#shake = Math.max(0, this.#shake - dt);

    this.player.update(dt, input);

    // смена локации
    if (this.distance >= this.#nextBiomeAt) {
      this.#nextBiomeAt += CONFIG.TRANSITION_EVERY;
      this.#nextBiome();
    }

    // после смерти генератор молчит: на экране ничего не появляется
    if (!this.player.isDown) this.#generate();

    for (const o of this.#obstacles) o.update(dt);
    for (const e of this.#enemies) e.update(dt);
    for (const it of this.#items) it.update(dt);
    for (const p of this.#projectiles) p.update(dt);

    this.#collisions();

    // очистка
    const cull = this.camera.x - 90;
    this.#obstacles = this.#obstacles.filter((e) => !e.isDead && e.x + e.w > cull);
    this.#enemies = this.#enemies.filter((e) => !e.isDead && e.x + e.w > cull);
    this.#items = this.#items.filter((e) => !e.isDead && e.x + e.w > cull);
    this.#projectiles = this.#projectiles.filter((e) => !e.isDead && e.x + e.w > cull);
    this.#pits = this.#pits.filter((e) => !e.isDead);

    this.#updateParticles(dt);
    this.#updateCamera(dt);
  }

  #collisions() {
    const player = this.player;
    const hb = player.hitbox;
    const feet = player.y + player.h;

    const check = (e) => {
      if (e.isDead) return;
      if (e.collectible) {
        if (rectsOverlap(hb, e.hitbox)) {
          e.onCollect(player);
          e.kill();
          this.spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#ffe9a8', 4, -40);
        }
        return;
      }
      if (!e.damageOnTouch) return;
      if (!rectsOverlap(hb, e.hitbox)) return;

      // прыжок на врага (работает и во время неуязвимости — стомп не «теряется»)
      if (e.stompable && player.vy > 0 && feet - e.y < 14) {
        e.onStomp(player);
        player.bounce();
        return;
      }
      if (player.invulnerable || player.isDown) return;

      const hit = player.takeDamage(1);
      if (hit) e.onHit(player);
    };

    for (const e of this.#obstacles) check(e);
    for (const e of this.#enemies) check(e);
    for (const e of this.#projectiles) check(e);
    for (const e of this.#items) check(e);
  }

  #updateCamera(dt) {
    const targetX = this.player.x - 62;
    // после смерти камера замирает (труп лежит на земле — мир не «улетает»)
    const targetY = this.player.isDown
      ? 0
      : Math.max(0, (this.player.y + this.player.h - CONFIG.GROUND_Y) - 36);
    const k = Math.min(1, dt * 9);
    this.camera.x += (targetX - this.camera.x) * k;
    this.camera.y += (targetY - this.camera.y) * k;
    if (this.#shake > 0) {
      this.camera.x += (Math.random() - 0.5) * 3;
      this.camera.y += (Math.random() - 0.5) * 3;
    }
  }

  // ------------------------------------------------------------------
  // Отрисовка
  // ------------------------------------------------------------------

  draw(ctx) {
    const cam = this.camera;
    const prev = this.#prevBiome;
    // плавный кроссфейд старой и новой локации (smoothstep)
    let fade = 1;
    if (prev) {
      const t = clamp(this.#transT / World.FADE_TIME, 0, 1);
      fade = t * t * (3 - 2 * t);
    }

    if (prev) {
      prev.drawBackground(ctx, cam);
      this.drawGround(ctx, cam, prev);
      ctx.globalAlpha = fade;
    }
    this.biome.drawBackground(ctx, cam);
    this.drawGround(ctx, cam, this.biome);
    ctx.globalAlpha = 1;

    for (const it of this.#items) it.draw(ctx, cam);
    for (const o of this.#obstacles) o.draw(ctx, cam);
    for (const e of this.#enemies) e.draw(ctx, cam);
    for (const p of this.#projectiles) p.draw(ctx, cam);

    this.player.draw(ctx, cam);
    this.#drawParticles(ctx, cam);

    if (prev) {
      prev.drawForeground(ctx, cam);
      ctx.globalAlpha = fade;
    }
    this.biome.drawForeground(ctx, cam);
    ctx.globalAlpha = 1;
  }

  /** Отрисовка земли с пропуском ям (ямы дорисовывают себя поверх). */
  drawGround(ctx, cam, biome = this.biome) {
    const S = CONFIG.SCALE;
    const W = CONFIG.WIDTH;
    const topH = 4 * S;
    const gy = CONFIG.GROUND_Y;

    ctx.fillStyle = biome.groundLine;
    ctx.fillRect(0, gy, W, S);
    ctx.fillStyle = biome.groundTop;
    ctx.fillRect(0, gy + S, W, topH - S);
    ctx.fillStyle = biome.groundDirt;
    ctx.fillRect(0, gy + topH, W, CONFIG.HEIGHT);

    // крапинки грунта (параллакс к земле)
    ctx.fillStyle = biome.groundShade;
    const off1 = (cam.x * 1.0) % 26;
    for (let x = -off1; x < W + 26; x += 26) {
      ctx.fillRect(Math.round(x) + 4, gy + topH + 4, 7, 3);
      ctx.fillRect(Math.round(x) + 14, gy + topH + 11, 4, 2);
    }
  }

  #drawParticles(ctx, cam) {
    for (const p of this.#particles) {
      ctx.globalAlpha = clamp(p.life * 3, 0, 1);
      ctx.fillStyle = p.color;
      const S = CONFIG.SCALE;
      ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y - cam.y), p.size * S, p.size * S);
    }
    ctx.globalAlpha = 1;
  }
}

  <script>
/* ==== js/ui/PauseButton.js ==== */
/**
 * PauseButton — кнопка паузы и динамика в правом верхнем углу.
 * Зоны касаний инкапсулированы здесь; HUD рисуется отдельно.
 */
class PauseButton {
  static ZONES = {
    pause: { x: CONFIG.WIDTH - 46, y: 4, w: 20, h: 20 },
    mute: { x: CONFIG.WIDTH - 22, y: 4, w: 18, h: 20 },
  };

  /** @returns {'pause'|'mute'|null} какая зона попала под палец. */
  static hit(x, y) {
    for (const [name, z] of Object.entries(PauseButton.ZONES)) {
      if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return name;
    }
    return null;
  }

  static draw(ctx, paused, muted) {
    const p = PauseButton.ZONES.pause;
    // подложка
    ctx.fillStyle = 'rgba(10,8,16,0.55)';
    ctx.fillRect(p.x - 2, p.y - 2, p.w + 4, p.h + 4);
    ctx.fillStyle = '#f2e2b0';
    if (paused) {
      // треугольник «play»
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(p.x + 7, p.y + 4 + i * 2, 2 + i * 2, 2);
      }
    } else {
      // две полоски «pause»
      ctx.fillRect(p.x + 5, p.y + 4, 4, 12);
      ctx.fillRect(p.x + 12, p.y + 4, 4, 12);
    }

    const m = PauseButton.ZONES.mute;
    ctx.fillStyle = 'rgba(10,8,16,0.55)';
    ctx.fillRect(m.x - 2, m.y - 2, m.w + 4, m.h + 4);
    ctx.fillStyle = muted ? '#8a8494' : '#f2e2b0';
    // динамик
    ctx.fillRect(m.x + 3, m.y + 8, 3, 4);
    ctx.fillRect(m.x + 6, m.y + 6, 2, 8);
    if (muted) {
      // перечёркнут
      ctx.fillRect(m.x + 10, m.y + 6, 2, 2);
      ctx.fillRect(m.x + 12, m.y + 8, 2, 2);
      ctx.fillRect(m.x + 10, m.y + 10, 2, 2);
      ctx.fillRect(m.x + 8, m.y + 12, 2, 2);
    } else {
      // волны
      ctx.fillRect(m.x + 10, m.y + 6, 2, 6);
      ctx.fillRect(m.x + 13, m.y + 4, 2, 10);
    }
  }
}

  <script>
/* ==== js/ui/TouchControls.js ==== */
/**
 * TouchControls — невидимые тач-зоны управления (паттерн Facade).
 *
 * Кнопки на экране НЕ рисуются: управление на десктопе — клавиатурой,
 * на сенсорных устройствах — тапами по зонам (правая половина — прыжок,
 * левая нижняя четверть — скольжение). Мультитач поддержан:
 * у каждого пальца своя зона.
 */
class TouchControls {
  #releases = new Map(); // pointerId -> функция отпускания
  #canvas;

  constructor(canvas, input) {
    this.#canvas = canvas;
    this.input = input;

    canvas.addEventListener('pointerdown', (e) => this.#down(e), { passive: false });
    window.addEventListener('pointerup', (e) => this.#up(e));
    window.addEventListener('pointercancel', (e) => this.#up(e));
  }

  /** Преобразование координат события в логические пиксели канваса. */
  #toLogical(e) {
    const rect = this.#canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (CONFIG.WIDTH / rect.width),
      y: (e.clientY - rect.top) * (CONFIG.HEIGHT / rect.height),
    };
  }

  #down(e) {
    e.preventDefault();
    const p = this.#toLogical(e);
    const zone = PauseButton.hit(p.x, p.y);
    if (zone === 'pause') { events.emit('ui:pause'); return; }
    if (zone === 'mute') { events.emit('audio:toggle'); return; }

    // невидимые зоны: правая половина — прыжок, левый низ — скольжение
    let action = null;
    if (p.y > CONFIG.HEIGHT * 0.34 && p.x > CONFIG.WIDTH * 0.5) action = 'jump';
    else if (p.y > CONFIG.HEIGHT * 0.5 && p.x <= CONFIG.WIDTH * 0.5) action = 'slide';

    if (action) {
      const release = this.input.bindPointer(e.pointerId, action);
      this.#releases.set(e.pointerId, release);
    }
  }

  #up(e) {
    const release = this.#releases.get(e.pointerId);
    if (release) {
      release();
      this.#releases.delete(e.pointerId);
    }
  }
}

  <script>
/* ==== js/ui/HUD.js ==== */
/**
 * HUD — heads-up display: жизни, очки, метры, название локации,
 * всплывающие сообщения. Подписан на события мира (Observer):
 * сама не лезет в World за «кнопками», только читает состояние.
 */
class HUD {
  #message = '';
  #messageSub = '';
  #messageTimer = 0;
  #flash = 0;

  constructor() {
    events.on('biome:changed', ({ biome, loop }) => {
      this.#message = biome.name;
      this.#messageSub = loop > 0 ? 'КРУГ ' + (loop + 1) : '';
      this.#messageTimer = 2.2;
    });
    events.on('player:hurt', () => { this.#flash = 0.25; });
  }

  update(dt) {
    this.#messageTimer = Math.max(0, this.#messageTimer - dt);
    this.#flash = Math.max(0, this.#flash - dt);
  }

  draw(ctx, world) {
    const W = CONFIG.WIDTH;

    // верхняя панель
    ctx.fillStyle = 'rgba(10,8,16,0.45)';
    ctx.fillRect(0, 0, W, 22);

    // жизни: три пиксельных «сердечка»-квадратика (пустые — потерянные)
    for (let i = 0; i < 3; i++) {
      this.drawLifeBlock(ctx, 6 + i * 12, 6, i < world.player.lives);
    }

    // очки и метры
    PixelFont.draw(ctx, 'ОЧКИ ' + world.score, W / 2, 4, { align: 'center', shadow: '#141220' });
    PixelFont.draw(ctx, world.distance + ' М', W / 2, 14, { align: 'center', color: '#c9c2ad', shadow: '#141220' });

    // скорость/сложность — тонкая полоска справа
    const diffW = 40;
    ctx.fillStyle = 'rgba(10,8,16,0.5)';
    ctx.fillRect(W - diffW - 52, 8, diffW, 5);
    ctx.fillStyle = '#c9832e';
    ctx.fillRect(W - diffW - 52, 8, Math.round(diffW * world.difficulty), 5);

    // красная вспышка при уроне
    if (this.#flash > 0) {
      ctx.fillStyle = 'rgba(176,48,39,' + (this.#flash * 0.9) + ')';
      ctx.fillRect(0, 0, W, CONFIG.HEIGHT);
    }

    // сообщение о новой локации
    if (this.#messageTimer > 0) {
      const t = this.#messageTimer;
      const alpha = clamp(t > 1.9 ? (2.2 - t) * 3 : Math.min(1, t), 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(10,8,16,0.6)';
      ctx.fillRect(0, 70, W, 40);
      PixelFont.draw(ctx, this.#message, W / 2, 78, { align: 'center', scale: 3, color: '#f2e2b0', shadow: '#141220' });
      if (this.#messageSub) {
        PixelFont.draw(ctx, this.#messageSub, W / 2, 102, { align: 'center', color: '#c9832e', shadow: '#141220' });
      }
      ctx.globalAlpha = 1;
    }
  }

  /** Пиксельный квадратик жизни (вместо сердечек-предметов, как в Godot):
   *  рамка + светлая шапка сверху-слева; alive=false — пустой слот. */
  drawLifeBlock(ctx, x, y, alive) {
    const base = alive ? '#c8322a' : '#33303e';
    const hi = alive ? '#ef6a5c' : '#43404f';
    const sh = alive ? '#7d1c15' : '#26232f';
    ctx.fillStyle = base;
    ctx.fillRect(x, y, 8, 8);
    ctx.fillStyle = hi;
    ctx.fillRect(x, y, 8, 2);
    ctx.fillRect(x, y, 2, 8);
    ctx.fillStyle = sh;
    ctx.fillRect(x, y + 6, 8, 2);
    ctx.fillRect(x + 6, y, 2, 8);
  }
}

  <script>
/* ==== js/game/Game.js ==== */
/**
 * Game — ядро игры и конечный автомат состояний (паттерн «Состояние»).
 *
 * Состояния: MenuState → PlayState ⇄ PauseState, PlayState → OverState.
 * Каждое состояние само решает, как обновляться и что рисовать.
 * Game инкапсулирует цикл, «звуковую проводку» событий и рекорд.
 */
class Game {
  #lastTs = 0;
  #best = 0;

  constructor(canvas, input) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    // Буфер канваса — 2x мировых единиц (см. index.html): спрайты
    // рисуются в мировых координатах, детали арта 1:1 с Godot.
    this.ctx.scale(2, 2);
    this.input = input;

    this.world = new World(input);
    this.hud = new HUD();
    this.touch = new TouchControls(canvas, input);

    this.#best = Game.loadBest();
    this.states = {
      menu: new MenuState(this),
      play: new PlayState(this),
      pause: new PauseState(this),
      over: new OverState(this),
      victory: new VictoryState(this),
    };
    this.state = this.states.menu;

    this.#bindEvents();
    this.state.enter();
  }

  get best() { return this.#best; }
  get finalScore() { return this.world.score + this.world.distance; }

  static loadBest() {
    try { return parseInt(localStorage.getItem('jungleRunBest') || '0', 10) || 0; } catch (e) { return 0; }
  }

  saveBest(v) {
    this.#best = Math.max(this.#best, v);
    try { localStorage.setItem('jungleRunBest', String(this.#best)); } catch (e) { /* нет хранилища — не беда */ }
  }

  #bindEvents() {
    const audio = () => AudioManager.instance;

    // --- звуковая «проводка»: события -> чиптюновые эффекты ---
    events.on('player:jump', () => audio().play('jump'));
    events.on('player:doubleJump', () => audio().play('doubleJump'));
    events.on('player:slide', () => audio().play('slide'));
    events.on('player:hurt', () => audio().play('hurt'));
    events.on('player:fall', () => audio().play('fall'));
    events.on('player:dead', () => audio().play('gameOver'));
    events.on('enemy:stomped', () => audio().play('stomp'));
    events.on('warrior:throw', () => audio().play('click'));
    events.on('enemy:alert', () => audio().play('click'));
    events.on('idol:collected', (p) => { if (!p || !p.silent) audio().play('coin'); });
    events.on('heart:collected', () => audio().play('heart'));
    events.on('biome:changed', ({ biome }) => {
      audio().play('biome');
      audio().playSong(biome.track);
    });
    events.on('audio:toggle', () => audio().toggleMute());
    // победа: все три локации пройдены
    events.on('victory', () => {
      if (this.state === this.states.play) this.setState('victory');
    });
    events.on('ui:pause', () => {
      if (this.state === this.states.play) this.setState('pause');
      else if (this.state === this.states.pause) this.setState('play');
    });

    // тап по экрану двигает неигровые состояния
    window.addEventListener('pointerdown', () => {
      const s = this.state;
      if (s === this.states.menu) this.startRun();
      else if (s === this.states.pause) this.setState('play');
      else if (s === this.states.over && s.canRetry()) this.startRun();
      else if (s === this.states.victory && s.canRetry()) this.startRun();
    });

    // свернули окно — пауза
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.state === this.states.play) this.setState('pause');
    });
  }

  /** Начать/возобновить забег. */
  startRun() {
    this.world.reset();
    AudioManager.instance.play('start');
    events.emit('biome:changed', { biome: this.world.biome, loop: 0 });
    this.setState('play');
  }

  setState(state) {
    if (this.state && this.state.exit) this.state.exit();
    this.state = typeof state === 'string' ? this.states[state] : state;
    if (this.state && this.state.enter) this.state.enter();
  }

  /** Главный цикл (requestAnimationFrame). */
  start() {
    const frame = (ts) => {
      const dt = clamp((ts - this.#lastTs) / 1000, 0, 0.05);
      this.#lastTs = ts;

      this.state.update(dt);
      this.state.draw(this.ctx);
      this.input.endFrame();

      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}

// ----------------------------------------------------------------------
// Состояния (State pattern)
// ----------------------------------------------------------------------

/** Заставка: мир «дышит» на фоне, ждём тапа/пробела. */
class MenuState {
  constructor(game) { this.game = game; this.t = 0; }

  enter() {
    this.t = 0;
    AudioManager.instance.playSong(this.game.world.biome.track);
  }

  update(dt) {
    this.t += dt;
    this.game.world.biome.tick(dt);
    if (this.game.input.wasPressed('jump') || this.game.input.wasPressed('pause')) {
      this.game.startRun();
    }
  }

  draw(ctx) {
    const cam = { x: this.t * 46, y: 0 };
    const world = this.game.world;
    world.biome.drawBackground(ctx, cam);
    world.drawGround(ctx, cam);
    world.biome.drawForeground(ctx, cam);

    // затемнение под текст
    ctx.fillStyle = 'rgba(10,8,16,0.45)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    const cx = CONFIG.WIDTH / 2;
    PixelFont.draw(ctx, 'JUNGLE', cx, 44, { align: 'center', scale: 4, color: '#f2e2b0', shadow: '#141220' });
    PixelFont.draw(ctx, 'RUN', cx, 76, { align: 'center', scale: 4, color: '#c9832e', shadow: '#141220' });

    // мигающий призыв — единственная подпись под логотипом
    if (Math.floor(this.t * 2) % 2 === 0) {
      PixelFont.draw(ctx, 'НАЖМИ ЛЮБУЮ КНОПКУ ДЛЯ СТАРТА', cx, 122, {
        align: 'center', color: '#f7f3e3', shadow: '#141220',
      });
    }

    PauseButton.draw(ctx, false, AudioManager.instance.muted);
  }
}

/** Игра идёт: мир обновляется, кнопки паркура на экране. */
class PlayState {
  constructor(game) { this.game = game; this.overTimer = 0; }

  enter() { this.overTimer = 1.0; }

  update(dt) {
    const game = this.game;
    game.world.update(dt, game.input);
    game.hud.update(dt);

    if (game.input.wasPressed('pause')) { game.setState('pause'); return; }

    if (game.world.player.isDown) {
      this.overTimer -= dt;
      if (this.overTimer <= 0) {
        game.saveBest(game.finalScore);
        game.setState('over');
      }
    }
  }

  draw(ctx) {
    const game = this.game;
    game.world.draw(ctx);
    game.hud.draw(ctx, game.world);
    PauseButton.draw(ctx, false, AudioManager.instance.muted);
  }
}

/** Пауза: мир заморожен. */
class PauseState {
  constructor(game) { this.game = game; }

  update() {
    if (this.game.input.wasPressed('pause') || this.game.input.wasPressed('jump')) {
      this.game.setState('play');
    }
  }

  draw(ctx) {
    const game = this.game;
    game.world.draw(ctx);
    game.hud.draw(ctx, game.world);

    ctx.fillStyle = 'rgba(10,8,16,0.65)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    PixelFont.draw(ctx, 'ПАУЗА', CONFIG.WIDTH / 2, 70, {
      align: 'center', scale: 3, color: '#f2e2b0', shadow: '#141220',
    });
    PixelFont.draw(ctx, 'НАЖМИ ЧТОБЫ ПРОДОЛЖИТЬ', CONFIG.WIDTH / 2, 104, {
      align: 'center', color: '#c9c2ad', shadow: '#141220',
    });
    PauseButton.draw(ctx, true, AudioManager.instance.muted);
  }
}

/** Конец забега: итоги и рекорд. */
class OverState {
  constructor(game) { this.game = game; this.t = 0; }

  enter() { this.t = 0; }

  canRetry() { return this.t > 0.6; }

  update(dt) { this.t += dt; }

  draw(ctx) {
    const game = this.game;
    game.world.draw(ctx);

    ctx.fillStyle = 'rgba(10,8,16,0.7)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    const cx = CONFIG.WIDTH / 2;
    PixelFont.draw(ctx, 'ИГРА ОКОНЧЕНА', cx, 34, { align: 'center', scale: 3, color: '#b03027', shadow: '#141220' });
    PixelFont.draw(ctx, 'ОЧКИ ' + game.finalScore, cx, 74, { align: 'center', color: '#f2e2b0', shadow: '#141220' });
    PixelFont.draw(ctx, 'ДИСТАНЦИЯ ' + game.world.distance + ' М', cx, 88, { align: 'center', color: '#c9c2ad', shadow: '#141220' });
    PixelFont.draw(ctx, 'РЕКОРД ' + game.best, cx, 102, { align: 'center', color: '#c9832e', shadow: '#141220' });

    if (Math.floor(this.t * 2) % 2 === 0) {
      PixelFont.draw(ctx, 'НАЖМИ ЧТОБЫ НАЧАТЬ СНАЧАЯ', cx, 130, { align: 'center', color: '#f7f3e3', shadow: '#141220' });
    }
  }
}

/** Победа: все три локации пройдены! Бриллиант и предложение сыграть ещё. */
class VictoryState {
  constructor(game) { this.game = game; this.t = 0; }

  enter() {
    this.t = 0;
    this.game.saveBest(this.game.finalScore);
    const audio = AudioManager.instance;
    audio.stopSong();
    audio.play('victory');
  }

  canRetry() { return this.t > 0.8; }

  update(dt) {
    this.t += dt;
    if (this.canRetry() && (this.game.input.wasPressed('jump') || this.game.input.wasPressed('pause'))) {
      this.game.startRun();
    }
  }

  draw(ctx) {
    const game = this.game;
    const t = this.t;
    game.world.draw(ctx);

    ctx.fillStyle = 'rgba(10,8,16,0.62)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    const cx = CONFIG.WIDTH / 2;

    // --- бриллиант: процедурный огранённый алмаз с бликом ---
    const bob = Math.round(Math.sin(t * 2.2) * 3);
    const dy = 20 + bob;
    // корона (верх)
    ctx.fillStyle = '#8fe8f0';
    ctx.fillRect(cx - 10, dy, 20, 2);
    ctx.fillStyle = '#5fd0e0';
    ctx.fillRect(cx - 12, dy + 2, 24, 4);
    ctx.fillStyle = '#3fb8d8';
    ctx.fillRect(cx - 14, dy + 6, 28, 3);
    // грани
    ctx.fillStyle = '#c8f4f8';
    ctx.fillRect(cx - 10, dy + 2, 5, 3);
    ctx.fillRect(cx - 3, dy + 7, 4, 2);
    ctx.fillStyle = '#2a90b8';
    ctx.fillRect(cx + 5, dy + 3, 7, 5);
    ctx.fillRect(cx + 8, dy + 7, 4, 2);
    // низ-пирамида
    ctx.fillStyle = '#3fb8d8';
    ctx.fillRect(cx - 12, dy + 9, 24, 2);
    ctx.fillStyle = '#2a90b8';
    ctx.fillRect(cx - 8, dy + 11, 16, 3);
    ctx.fillRect(cx - 4, dy + 14, 8, 3);
    ctx.fillRect(cx - 2, dy + 17, 4, 2);
    // переливающиеся блики
    if (Math.floor(t * 3) % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 12, dy + 1, 2, 2);
      ctx.fillRect(cx + 10, dy + 8, 1, 1);
    }

    PixelFont.draw(ctx, 'ПОБЕДА', cx, 66, { align: 'center', scale: 4, color: '#f2e2b0', shadow: '#141220' });
    PixelFont.draw(ctx, 'ВСЕ ЛОКАЦИИ ПРОЙДЕНЫ!', cx, 102, { align: 'center', color: '#8fe8f0', shadow: '#141220' });
    PixelFont.draw(ctx, 'ОЧКИ ' + game.finalScore, cx, 118, { align: 'center', color: '#f2e2b0', shadow: '#141220' });
    PixelFont.draw(ctx, 'РЕКОРД ' + game.best, cx, 132, { align: 'center', color: '#c9832e', shadow: '#141220' });

    if (Math.floor(this.t * 2) % 2 === 0) {
      PixelFont.draw(ctx, 'НАЖМИ ЧТОБЫ СЫГРАТЬ ЕЩЁ', cx, 156, { align: 'center', color: '#f7f3e3', shadow: '#141220' });
    }
  }
}

</script>
  <script>
/* ==== js/main.js ==== */
/**
 * main.js — точка входа: собирает всё вместе и запускает цикл.
 * Здесь нет логики игры — только «сборка» объектов (composition root).
 */
(function () {
  const canvas = document.getElementById('game');
  const input = new Input();
  const game = new Game(canvas, input);

  // для отладки и headless-тестов
  window.JungleRun = game;

  // запрещаем контекстное меню и «pull-to-refresh» на канвасе
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => e.preventDefault(), { passive: false });

  game.start();
})();

</script>
